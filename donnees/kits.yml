    description: |
      En revenant de Rome, les cloches ont semé leurs œufs. Les équipes doivent d'abord gagner leur confiance, atelier après atelier : le nid à reconstruire, la course à l'œuf, les lapins sauteurs, les œufs jumeaux, la chaîne des œufs, le renard et la poule.

      Puis vient la grande chasse, organisée pour être juste : une zone par tranche d'âge, une couleur par enfant, des énigmes pour les plus grands, et l'œuf d'or cherché tous ensemble. Chaque enfant repart avec la même part.

      Le kit contient le plan de la chasse à remplir par les adultes, pour que plus aucun œuf ne soit oublié au soleil.
    deroule:
      - "L'histoire des cloches et la formation des équipes."
      - "Six ateliers de 10 minutes, en rotation."
      - "Les paniers sont pleins : les cloches révèlent les zones de chasse."
      - "La grande chasse aux œufs, par âge et par couleur."
      - "Le goûter de Pâques, un jeu calme et les diplômes."
    pour_qui:
      - Familles et fêtes entre amis, de 6 à 12 enfants
      - Accueils de loisirs et écoles, de 20 à 40 enfants
      - De 3 à 11 ans, avec une chasse adaptée à chaque âge

