  # ---------------------------------------------------------------- Fêtes de l'année
  - id: kit-toussaint
    titre: Le grand jeu de la forêt d'automne
    univers: fetes
    publics: [accueils, ecoles]
    fete: toussaint
    etat: pret
    prix: "12"
    payhip_id: ""
    accroche: Un après-midi pour les vacances de la Toussaint. Six animaux de la forêt, six ateliers, et des terriers à remplir avant l'hiver.
    age: 4 à 11 ans
    joueurs: 6 à 40 enfants
    duree: 2 h à 3 h
    lieu: Dehors ou à l'intérieur
    preparation: 1 à 2 heures
    pages: 27
    contenu:
      - L'histoire de la Grande Chouette et le déroulé de l'après-midi
      - 6 ateliers, chacun en version dehors et à l'intérieur
      - La rotation pour 20 à 40 enfants, et la version famille
      - 3 jeux complémentaires, une activité manuelle, le goûter
      - Cartes réserves, terriers, panneaux, feuilles de route, diplômes
    description: |
      L'hiver arrive, et les terriers de la forêt sont encore vides. Chaque équipe devient une famille d'animaux et parcourt six ateliers, tenus par l'écureuil, le hérisson, la chouette, le cerf, la fourmi et le cueilleur. Chaque atelier réussi rapporte une réserve pour l'hiver.

      Le grand jeu est conçu pour les accueils de loisirs pendant les vacances de la Toussaint, avec une rotation prête à l'emploi pour 20 à 40 enfants, mais il fonctionne aussi en famille. Tous les ateliers ont une version à l'intérieur, pour les jours de pluie.

      Le kit complète l'après-midi avec trois jeux (un jeu de poursuite, une chasse aux couleurs d'automne, un jeu de rythme), une activité manuelle et des idées de goûter.
    deroule:
      - "La lettre de la Grande Chouette et la formation des familles d'animaux."
      - "Six ateliers de 10 minutes, en rotation."
      - "Les terriers sont pleins : l'hiver peut venir."
      - "Le goûter d'automne, puis un jeu complémentaire."
      - "La veillée de la chouette et les diplômes de gardien de la forêt."
    pour_qui:
      - Accueils de loisirs et écoles, de 20 à 40 enfants
      - Familles et fêtes entre amis, de 6 à 12 enfants
      - Un animateur par atelier, ou deux adultes en famille

  - id: kit-noel
    titre: L'atelier du père Noël
    univers: fetes
    publics: [accueils, ecoles, associations, cse]
    fete: noel
    etat: pret
    prix: "12"
    payhip_id: ""
    accroche: Les lutins sont malades et la tournée part ce soir. Six ateliers pour remplir la hotte avant minuit.
    age: 4 à 11 ans
    joueurs: 6 à 120 enfants
    duree: 2 h à 3 h
    lieu: Salle, maison ou cour
    preparation: 1 à 2 heures
    pages: 32
    contenu:
      - Le message urgent du père Noël et le déroulé de l'après-midi
      - 6 ateliers de l'atelier du Pôle Nord, du jouet au traîneau
      - La rotation pour 20 à 40 enfants et la version arbre de Noël de CSE
      - 3 jeux complémentaires, une activité manuelle, le goûter
      - Modèles en pixels, lettres à trier, hottes, cartes de lutin, diplômes
    description: |
      Ce matin, tous les lutins ont attrapé la grippe, et la tournée part ce soir. Les enfants deviennent lutins apprentis : ils fabriquent les jouets, emballent les paquets, trient les lettres, nourrissent les rennes, préparent la neige et chargent le traîneau. Chaque atelier réussi met un cadeau dans la hotte de leur équipe.

      Le kit fonctionne à toutes les échelles : un salon avec huit cousins, une école ou un accueil de loisirs avec une rotation pour 20 à 40 enfants, ou l'arbre de Noël d'un comité d'entreprise, avec une version en stands pour 40 à 120 enfants.

      Il se termine par la lettre de remerciement du père Noël, à lire avant son arrivée ou avant l'ouverture des cadeaux.
    deroule:
      - "Le message urgent du Pôle Nord et la formation des équipes de lutins."
      - "Six ateliers de 10 minutes, en rotation ou en stands."
      - "Les hottes sont pleines : le traîneau peut partir."
      - "Le goûter de Noël, puis un jeu complémentaire."
      - "La lettre du père Noël et les diplômes de lutin d'honneur."
    pour_qui:
      - Familles, écoles et accueils de loisirs
      - Arbres de Noël de CSE et d'associations, jusqu'à 120 enfants
      - De 4 à 11 ans, avec des versions pour chaque âge

  - id: kit-carnaval
    titre: Le grand bal du carnaval
    univers: fetes
    publics: [accueils, ecoles, associations]
    fete: carnaval
    etat: pret
    prix: "12"
    payhip_id: ""
    accroche: Monsieur Carnaval a perdu ses couleurs. Six ateliers pour les retrouver, puis le défilé, le bal et le procès de Monsieur Carnaval.
    age: 4 à 11 ans
    joueurs: 6 à 40 enfants
    duree: 2 h à 3 h
    lieu: Salle, maison ou cour
    preparation: 1 à 2 heures
    pages: 28
    contenu:
      - L'histoire de Monsieur Carnaval et le déroulé de l'après-midi
      - 6 ateliers adaptés aux enfants déguisés
      - La rotation pour 20 à 40 enfants, et la version famille
      - Le défilé, la farandole et le procès de Monsieur Carnaval
      - Cartes de mime et de rythmes, chars, panneaux, diplômes
    description: |
      Le vent d'hiver a emporté toutes les couleurs de Monsieur Carnaval. Chaque équipe décore un char en retrouvant une couleur à chaque atelier : les confettis, le jongleur, le mime, la fanfare, le bal des masques et la chenille du carnaval.

      Les ateliers sont pensés pour des enfants déguisés : peu de courses, beaucoup d'adresse, de musique et d'expression, pour que les costumes restent intacts jusqu'au défilé.

      L'après-midi se termine par la tradition la plus joyeuse du carnaval : le procès de Monsieur Carnaval, accusé de toutes les misères de l'hiver, avec l'acte d'accusation prêt à lire.
    deroule:
      - "Le tour des déguisements et l'histoire de Monsieur Carnaval."
      - "Six ateliers de 10 minutes, en rotation."
      - "Les chars sont colorés : Monsieur Carnaval se réveille."
      - "Le goûter, puis le grand défilé et la farandole."
      - "Le procès de Monsieur Carnaval, le bal et les diplômes."
    pour_qui:
      - Écoles et accueils de loisirs, de 20 à 40 enfants
      - Familles et fêtes entre amis, de 6 à 12 enfants
      - De 4 à 11 ans, déguisés ou non

  - id: kit-paques
    titre: La grande quête des cloches
    univers: fetes
    publics: [accueils, ecoles, associations, cse]
    fete: paques
    etat: pret
    prix: "12"
    payhip_id: ""
    accroche: Six ateliers pour gagner les indices des cloches, puis une chasse aux œufs juste, organisée par âge.
    age: 3 à 11 ans
    joueurs: 6 à 40 enfants
    duree: 2 h à 3 h
    lieu: Jardin, parc ou salle
    preparation: 1 à 2 heures
    pages: 29
    contenu:
      - L'histoire des cloches et le déroulé de l'après-midi
