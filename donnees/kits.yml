# Les produits de la boutique.
# etat : pret (fichier fait, en attente de l'ouverture des ventes) | en_vente | en_preparation
# payhip_id : le code du produit sur Payhip (la fin de son adresse : payhip.com/b/AbC12 -> AbC12).
# Le bouton d'achat n'apparaît que si config.yml > boutique > ventes_actives vaut true,
# que le produit est « en_vente » et qu'il a un payhip_id.
# Chaque produit a sa page : /boutique/<id>/. Ses images sont dans statique/img/kits/<id>*.jpg
# (exportées depuis le dossier privé des produits par exporter_images.py).
# pack : relie le produit aux jeux de donnees/jeux.yml (6-9, 10-13, 14-17 ou tout).
# fete : place le kit sur la page de sa fête (donnees/fetes.yml).
# publics : place le kit dans les rubriques de la page Professionnels (accueils, ecoles, associations, clubs, cse).
# Jamais de règles détaillées ici : seulement ce qui donne envie et permet de choisir.

kits:
  # ---------------------------------------------------------------- Anniversaires
  - id: olympiades-anniversaire
    titre: Les Olympiades d'anniversaire
    univers: anniversaires
    etat: pret
    prix: "12"
    payhip_id: ""
    accroche: Des équipes, un défilé, huit épreuves et une remise de médailles, avec le matériel de la maison.
    age: 6 à 12 ans
    joueurs: 6 à 16 enfants
    duree: 1 h 30
    lieu: Salon ou jardin
    preparation: Une soirée la veille
    pages: 35
    contenu:
      - Le déroulé minute par minute, de l'accueil au podium
      - 8 fiches d'épreuves détaillées et 2 épreuves de rechange
      - Le barème, le point de fair-play et les distinctions
      - Invitations, fanions, panneaux et feuille de score
      - Le serment des athlètes, les médailles et les diplômes
    description: |
      Les Olympiades sont le grand jeu qui marche à tous les coups en accueil de loisirs. Ce kit les adapte à la maison : quatre équipes, un défilé d'ouverture, huit épreuves qui alternent adresse, rapidité, coopération et mémoire, puis une vraie cérémonie de remise des médailles.

      Chaque épreuve tient sur une page : la règle à annoncer en une phrase, le matériel à cocher, l'installation, le déroulement, le rôle de l'adulte, et une version plus facile et plus difficile. Le matériel est celui de la maison : chaussettes, cuillères, gobelets, bouteilles d'eau.

      Le barème et le point de fair-play sont pensés pour que l'ambiance reste bonne jusqu'au bout, et que chaque équipe reparte avec une distinction.
    deroule:
      - "Accueil : chaque équipe choisit un nom de pays et décore son fanion."
      - "Cérémonie d'ouverture : défilé en musique et serment des athlètes."
      - "Deux manches de quatre épreuves, en ateliers qui tournent."
      - "Goûter, pendant que les adultes comptent les points."
      - "Podium, médailles et diplômes pour tous."
    pour_qui:
      - Un anniversaire de 6 à 16 enfants de 6 à 12 ans
      - Une fête de quartier ou un mercredi en accueil de loisirs
      - Deux adultes suffisent, trois avec les plus jeunes

  - id: chasse-tresor-pirates
    titre: La chasse au trésor des pirates
    univers: anniversaires
    etat: pret
    prix: "9,90"
    payhip_id: ""
    accroche: Six épreuves pour reconstituer la carte du capitaine Barbe-Grise et retrouver son coffre.
    age: 5 à 9 ans
    joueurs: 5 à 14 enfants
    duree: 1 h 30
    lieu: Maison, jardin ou parc
    preparation: 1 heure la veille
    pages: 27
    contenu:
      - L'histoire à raconter et le déroulé minute par minute
      - 6 épreuves, chacune récompensée par un morceau de carte
      - La carte au trésor en 6 morceaux, à compléter avec votre cachette
      - Le message codé, les noms de pirate et le serment de l'équipage
      - Invitations, panneaux, étiquettes du butin et certificats de pirate
    description: |
      Une vraie aventure, pas une suite de jeux : chaque épreuve rapporte un morceau de la carte du capitaine Barbe-Grise. Quand les six morceaux sont réunis, la carte révèle la cachette du coffre, que vous avez choisie et écrite à l'avance.

      Les enfants jouent tous ensemble, comme un seul équipage : pas de perdant, pas d'éliminé, et un butin partagé à parts égales, comme le veut le serment des pirates. Les épreuves fonctionnent sans savoir lire, avec une version plus difficile pour les lecteurs.

      Le kit contient la carte au trésor illustrée, prête à découper, le message codé de la bouteille à la mer avec sa grille, et tout ce qu'il faut pour transformer le salon ou le jardin en île au trésor.
    deroule:
      - "Embarquement : chaque enfant trouve son nom de pirate et décore son bandeau."
      - "L'histoire de Barbe-Grise et le serment de l'équipage."
      - "Six épreuves, du pont des requins à la grotte du Crâne."
      - "La carte est complète : chasse finale jusqu'au coffre."
      - "Partage du butin et certificats de pirate."
    pour_qui:
      - Un anniversaire de 5 à 14 enfants de 5 à 9 ans
      - Lecteurs et non-lecteurs ensemble
      - Deux adultes, un qui anime et un qui prépare la suite

  - id: enquete-gateau-disparu
    titre: L'enquête du gâteau disparu
    univers: anniversaires
    etat: pret
    prix: "12"
    payhip_id: ""
    accroche: Le gâteau d'anniversaire a disparu. Six suspects, six épreuves de détective, une seule vérité.
    age: 8 à 12 ans
    joueurs: 6 à 12 enfants
    duree: 1 h 45
    lieu: Maison ou jardin
    preparation: 1 heure la veille
    pages: 31
    contenu:
      - L'histoire, le déroulé et la solution expliquée pas à pas
      - 6 épreuves de détective, dont l'encre invisible
      - 6 fiches de suspects, 6 cartes de cachettes, 12 cartes indices
      - Le carnet d'enquête et les 6 lettres des suspects
      - Convocations, cartes d'enquêteur, panneaux et diplômes
    description: |
      Juste avant la fête, le gâteau d'anniversaire a disparu. Deux brigades d'enquêteurs mènent l'affaire : chaque épreuve réussie rapporte une enveloppe de deux indices, qui éliminent des suspects et des contenants. À elles de recouper, de raisonner, et de convaincre le commissaire.

      L'enquête est construite avec soin : une seule solution possible, des indices qui se recoupent, une fausse piste pour pimenter le jeu, et aucune question injuste. Les épreuves font travailler l'observation, la logique et l'expression : empreintes digitales, scène du crime, message codé, détecteur de mensonges, filature et encre invisible.

      À la fin, chaque brigade accuse un suspect et ouvre sa lettre. Le coupable avoue… et révèle où il a caché le vrai gâteau.
    deroule:
      - "Convocation au commissariat et présentation des six suspects."
      - "Six épreuves de détective, deux par deux."
      - "Un point d'enquête après chaque paire d'épreuves."
      - "L'accusation : chaque brigade présente son raisonnement."
      - "Le coupable avoue, et tout le monde court chercher le gâteau."
    pour_qui:
      - Un anniversaire de 6 à 12 enfants de 8 à 12 ans
      - Des enfants qui savent lire (les plus jeunes en binôme)
      - Deux adultes, dont un commissaire qui garde les indices

  - id: safari-petits-explorateurs
    titre: Le safari des petits explorateurs
    univers: anniversaires
    etat: pret
    prix: "9,90"
    payhip_id: ""
    accroche: Un anniversaire d'une heure pour les 3-5 ans, avec six ateliers courts, sans perdant ni temps mort.
    age: 3 à 5 ans
    joueurs: 4 à 10 enfants
    duree: 1 h
    lieu: Salon ou jardin
    preparation: 45 minutes la veille
    pages: 21
    contenu:
      - Le déroulé d'une heure, pensé pour l'attention des tout-petits
      - 6 ateliers de 5 à 8 minutes, du lion à la girafe
      - La comptine des explorateurs, écrite pour le kit
      - Les cartes des animaux et des empreintes, sans texte à lire
      - Passeports d'explorateur, médailles, diplômes et invitations
    description: |
      Avant 6 ans, un enfant joue avec les autres plus qu'il ne joue contre eux. Ce kit en tient compte : des ateliers courts, un adulte proche, une comptine qui revient à chaque déplacement, et une réussite à chaque fois.

      Le guide du safari emmène le groupe à la rencontre de six animaux. Chaque animal propose un petit jeu (marcher comme lui, traverser la rivière aux crocodiles, nourrir le singe, retrouver les empreintes), et chaque enfant reçoit un tampon dans son passeport d'explorateur.

      Les pièces à imprimer sont faites pour des enfants qui ne lisent pas : cartes illustrées des animaux et des empreintes, passeport en images. Le guide donne aussi des conseils pour les pleurs, la timidité et la sieste.
    deroule:
      - "Accueil : fabrication des jumelles et décoration du passeport."
      - "Le grand départ, en chantant la comptine des explorateurs."
      - "Cinq rencontres avec les animaux de la savane."
      - "La grande recherche des animaux cachés."
      - "Retour au campement : médailles, diplômes, pique-nique."
    pour_qui:
      - Un anniversaire de 4 à 10 enfants de 3 à 5 ans
      - Un adulte pour 4 enfants
      - Les grands frères et sœurs peuvent devenir guides

