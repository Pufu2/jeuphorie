# Les univers du site : une couleur et un public chacun.
univers:
  - id: anniversaires
    nom: Anniversaires
    url: /anniversaires/
    couleur: fete
    titre_page: Jeux d'anniversaire pour enfants, à imprimer
    public: Parents
    accroche: "Olympiades, chasse au trésor, enquête, safari des tout-petits : un anniversaire clé en main, de 3 à 12 ans."
    description: "Jeux d'anniversaire à imprimer pour les 3-12 ans : Olympiades, chasse au trésor des pirates, enquête du gâteau disparu, safari des petits. Déroulé, épreuves, invitations et diplômes."
    intro: >-
      Un anniversaire réussi, c'est un fil rouge qui tient les enfants
      ensemble pendant une heure et demie, puis un moment où chacun repart
      fier. Chaque kit donne ce fil rouge : une histoire, un déroulé minute
      par minute, des épreuves adaptées à l'âge, les invitations et les diplômes.
    points:
      - De 4 à 16 enfants, de 3 à 12 ans, dans un salon ou un jardin.
      - "Le matériel de la maison : gobelets, chaussettes, cuillères, cartons."
      - Une version plus facile et plus difficile de chaque épreuve.

  - id: grands-jeux
    nom: Grands jeux
    url: /grands-jeux/
    couleur: plein-air
    titre_page: Grands jeux et jeux collectifs à imprimer
    public: Animateurs, écoles, clubs et familles
    accroche: 34 jeux d'équipe pour la cour, le parc ou le gymnase, classés par âge de 6 à 17 ans.
    description: "Grands jeux et jeux collectifs à imprimer pour les 6-17 ans : béret, balle au capitaine, poules renards vipères, thèque, épervier gradé. Fiches avec règles, variantes et schéma du terrain."
    intro: >-
      Ces jeux sont ceux qui marchent tous les mercredis en accueil de
      loisirs : des règles claires, des équipes, du mouvement. Chaque fiche
      tient sur une ou deux pages, avec le matériel, la mise en place, les
      règles, les variantes et un schéma du terrain. Il suffit de l'imprimer
      et de l'emporter sur le terrain.
    points:
      - "Classés par âge : 6-9 ans, 10-13 ans, 14-17 ans."
      - "De 3 à 60 joueurs, avec le matériel d'une cour d'école : plots, chasubles, ballons."
      - Des variantes pour adapter chaque jeu au groupe et au terrain.

  - id: fetes
    nom: Fêtes de l'année
    nom_court: Fêtes
    url: /fetes/
    couleur: saison
    titre_page: "Jeux pour les fêtes de l'année : Toussaint, Noël, carnaval, Pâques"
    public: Familles, écoles, accueils de loisirs et CSE
    accroche: "Toussaint, Noël, carnaval, Pâques : un grand jeu et des ateliers prêts à animer pour chaque temps fort de l'année."
    description: "Jeux et animations pour les fêtes de l'année : Toussaint et automne, Noël, carnaval, Pâques. Kits à imprimer pour la famille, l'école, l'accueil de loisirs et l'arbre de Noël du CSE."
    intro: >-
      Chaque fête a ses jeux, et chacun de nos kits raconte une histoire : la forêt d'automne,
      l'atelier du père Noël, le grand bal du carnaval, la chasse aux œufs des cloches. Un grand jeu
      pour réunir tout le groupe, des ateliers pour varier, et tout ce qu'il faut imprimer.
    points:
      - Un après-midi complet par fête, avec un déroulé heure par heure.
      - Chaque jeu en version dehors et à l'intérieur.
      - Pour un salon en famille comme pour un groupe de 40 enfants.

  - id: kermesse
    nom: Kermesse
    url: /kermesse/
    couleur: soleil
    titre_page: Kermesse et fête de fin d'année clés en main
    public: Associations de parents d'élèves
    accroche: Les stands, les affiches, les tickets et le planning des bénévoles, prêts à imprimer.
    description: "Kermesse et fête d'école clés en main pour les associations de parents d'élèves : fiches de stands, affiches, tickets et planning des bénévoles."
    intro: >-
      Organiser une kermesse, c'est coordonner des bénévoles qui ne se
      connaissent pas toujours, pour des centaines d'enfants, en un
      après-midi. Le kit kermesse donne à chaque responsable de stand une
      fiche claire, et au bureau de l'association un planning qui tient.
    points:
      - "Une fiche par stand : règle, matériel, nombre de bénévoles."
      - Affiches, tickets et lots à imprimer.
      - Planning des bénévoles et liste de matériel à partager.

  - id: professionnels
    nom: Professionnels
    nom_court: Professionnels
    url: /professionnels/
    couleur: pro
    titre_page: "Outils et kits pour les structures : accueils de loisirs, écoles, associations, clubs, CSE"
    public: Accueils de loisirs, écoles, associations, clubs, CSE
    accroche: "Les outils de direction, les projets, les programmes et les événements d'une structure, prêts à l'emploi."
    description: "Kits et outils pour les professionnels de l'animation : projet pédagogique, livret d'accueil de l'équipe, semaine de vacances, récréation, association de parents, stage sportif, journée familles du CSE."
    intro: >-
      Diriger un accueil, animer une cour d'école, faire vivre une association ou organiser
      l'événement du comité d'entreprise : ce sont des métiers à part entière, avec leurs
      documents, leurs réunions et leurs imprévus. Ces outils ont été écrits par un directeur
      d'accueil de loisirs pour faire gagner du temps aux équipes, sans sacrifier la qualité.
    points:
      - "Des modèles prêts à remplir, en PDF et en Word."
      - "Des méthodes testées sur le terrain, avec les erreurs à éviter."
      - "Tout est inclus dans l'abonnement Pro Structure, pour toute l'équipe."
    publics:
      - id: accueils
        titre: Accueils de loisirs et périscolaire
        texte: >-
          Le projet pédagogique, l'accueil des nouveaux animateurs, le suivi de l'encadrement
          et du budget, et des programmes de vacances prêts à animer.
      - id: ecoles
        titre: Écoles
        texte: >-
          Une cour de récréation plus calme, des grands jeux pour la cour et le sport, et des
          après-midi de fête clés en main pour Noël, le carnaval ou la fin d'année.
      - id: associations
        titre: Associations de parents d'élèves
        texte: >-
          Le bureau, l'assemblée générale, la trésorerie, les démarches et les courriers, et
          les kits pour la kermesse, le carnaval ou le marché de Noël.
      - id: clubs
        titre: Clubs sportifs et centres de vacances
        texte: >-
          Un stage multisport de vacances prêt à animer, des échauffements ludiques et les
          grands jeux collectifs classés par âge.
      - id: cse
        titre: Comités d'entreprise (CSE)
        texte: >-
          La journée familles d'été et l'arbre de Noël clés en main, avec des stands que des
          élus et des bénévoles peuvent tenir sans être animateurs.
