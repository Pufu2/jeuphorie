# Les univers du site : une couleur et un public chacun.
univers:
  - id: anniversaires
    nom: Anniversaires
    url: /anniversaires/
    couleur: fete
    titre_page: Jeux d'anniversaire pour enfants, à imprimer
    public: Parents
    accroche: "Défi des champions, chasse au trésor, enquête, safari des tout-petits : un anniversaire clé en main, de 3 à 12 ans."
    description: "Jeux d'anniversaire à imprimer pour les 3-12 ans : défi des champions, chasse au trésor des pirates, enquête du gâteau disparu, safari des petits. Déroulé, épreuves, invitations et diplômes."
    intro: >-
      Un anniversaire réussi, c'est un fil rouge qui tient les enfants
      ensemble pendant une heure et demie, puis un moment où chacun repart
      fier. Chaque kit donne ce fil rouge : une histoire, un déroulé minute
      par minute, des épreuves adaptées à l'âge, les invitations et les diplômes.
    points:
      - De 4 à 16 enfants, de 3 à 12 ans, dans un salon ou un jardin.
      - "Le matériel de la maison : gobelets, chaussettes, cuillères, cartons."
      - Une version plus facile et plus difficile de chaque épreuve.

  - id: grands-jeux
    nom: Grands jeux
    url: /grands-jeux/
    couleur: plein-air
    titre_page: Grands jeux et jeux collectifs à imprimer
    public: Animateurs, écoles, clubs et familles
    accroche: 34 jeux d'équipe pour la cour, le parc ou le gymnase, classés par âge de 6 à 17 ans.
    description: "Grands jeux et jeux collectifs à imprimer pour les 6-17 ans : béret, balle au capitaine, poules renards vipères, thèque, épervier gradé. Fiches avec règles, variantes et schéma du terrain."
    intro: >-
      Ces jeux sont ceux qui marchent tous les mercredis en accueil de
      loisirs : des règles claires, des équipes, du mouvement. Chaque fiche
      tient sur une ou deux pages, avec le matériel, la mise en place, les
      règles, les variantes et un schéma du terrain. Il suffit de l'imprimer
      et de l'emporter sur le terrain.
    points:
      - "Classés par âge : 6-9 ans, 10-13 ans, 14-17 ans."
      - "De 3 à 60 joueurs, avec le matériel d'une cour d'école : plots, chasubles, ballons."
      - Des variantes pour adapter chaque jeu au groupe et au terrain.

  - id: fetes
    nom: Fêtes de l'année
    nom_court: Fêtes
    url: /fetes/
    couleur: saison
    titre_page: "Jeux pour les fêtes de l'année : Toussaint, Noël, carnaval, Pâques"
    public: Familles, écoles, accueils de loisirs et CSE
    accroche: "Toussaint, Noël, carnaval, Pâques : un grand jeu et des ateliers prêts à animer pour chaque temps fort de l'année."
    description: "Jeux et animations pour les fêtes de l'année : Toussaint et automne, Noël, carnaval, Pâques. Kits à imprimer pour la famille, l'école, l'accueil de loisirs et l'arbre de Noël du CSE."
    intro: >-
      Chaque fête a ses jeux, et chacun de nos kits raconte une histoire : la forêt d'automne,
      l'atelier du père Noël, le grand bal du carnaval, la chasse aux œufs des cloches. Un grand jeu
      pour réunir tout le groupe, des ateliers pour varier, et tout ce qu'il faut imprimer.
    points:
      - Un après-midi complet par fête, avec un déroulé heure par heure.
      - Chaque jeu en version dehors et à l'intérieur.
      - Pour un salon en famille comme pour un groupe de 40 enfants.

  - id: kermesse
    nom: Kermesse
    url: /kermesse/
    couleur: soleil
    titre_page: Kermesse et fête de fin d'année clés en main
    public: Associations de parents d'élèves
    accroche: Les stands, les affiches, les tickets et le planning des bénévoles, prêts à imprimer.
    description: "Kermesse et fête d'école clés en main pour les associations de parents d'élèves : fiches de stands, affiches, tickets et planning des bénévoles."
    intro: >-
      Organiser une kermesse, c'est coordonner des bénévoles qui ne se
      connaissent pas toujours, pour des centaines d'enfants, en un
      après-midi. Le kit kermesse donne à chaque responsable de stand une
      fiche claire, et au bureau de l'association un planning qui tient.
    points:
      - "Une fiche par stand : règle, matériel, nombre de bénévoles."
      - Affiches, tickets et lots à imprimer.
      - Planning des bénévoles et liste de matériel à partager.

  - id: pour-tous
    sortie: "2026-11-04"
    nom: Jeux pour tous
    nom_court: Jeux pour tous
    url: /jeux-pour-tous/
    couleur: inclusif
    titre_page: "Jeux inclusifs : jouer ensemble avec un enfant en situation de handicap"
    public: Familles, écoles, accueils de loisirs
    accroche: "Des jeux que tout le groupe joue ensemble, adaptés à un enfant aveugle, sourd, en fauteuil, autiste, avec une déficience intellectuelle, un TDAH ou un trouble dys."
    description: "Jeux inclusifs à imprimer pour jouer avec un enfant en situation de handicap : déficience visuelle, auditive, motrice, autisme, déficience intellectuelle, TDAH et troubles dys. 8 jeux adaptés par kit, à petit prix."
    intro: >-
      Un enfant en situation de handicap n'a pas besoin de jeux à part. Il a besoin que les jeux du groupe
      soient pensés pour lui aussi : une règle que l'on voit autant qu'on l'entend, un ballon qui sonne, un
      terrain à sa hauteur, un programme affiché. Chaque kit propose 8 jeux complets que tout le groupe joue
      ensemble, avec les adaptations pour que chacun ait une vraie place.
    points:
      - "Six kits, un par situation : vue, audition, motricité, autisme, déficience intellectuelle, TDAH et troubles dys."
      - Le même jeu pour tous, jamais une version à part pour un seul enfant.
      - "4,90 € le kit, 14,90 € les six : un prix volontairement bas, pour que ces jeux arrivent partout."
    sections:
      - titre: L'esprit de ces jeux
        liste:
          - "L'enfant d'abord : il a un prénom, des goûts et un âge, et c'est d'abord avec eux que l'on joue."
          - "Chaque enfant est différent : l'enfant et sa famille savent ce qui l'aide. Les kits commencent par une fiche à remplir avec eux."
          - "Une vraie difficulté pour chacun : un enfant qu'on laisse gagner le sent."
          - "Le droit de regarder et de faire une pause, toujours."
      - titre: Qui les a écrits
        texte: >-
          Ces kits sont écrits par un animateur, pas par un professionnel de santé. J'ai suivi le BPJEPS « Activités
          physiques pour tous », une formation de l'animation sportive qui comprend une initiation au handisport, mais je
          n'ai pas de diplôme dans le domaine du handicap ou de la santé. Les kits ne donnent donc aucun conseil médical, et
          ne remplacent ni l'avis des professionnels qui suivent l'enfant, ni son projet d'accueil individualisé. En cas de
          doute sur ce qu'un enfant peut faire, demandez toujours à sa famille.
      - titre: Des jeux à adapter
        texte: >-
          Ces jeux sont une base, pas une recette. Chaque enfant est différent, et un jeu pensé pour un enfant aveugle ou
          autiste ne conviendra pas forcément tel quel à celui que vous accueillez. N'hésitez pas à changer une règle, la
          durée, le terrain ou le matériel : c'est cette souplesse qui fait un bon jeu inclusif, et chaque kit vous aide à
          trouver les bonnes adaptations avec l'enfant et sa famille.
    # Les kits de cet univers sont rangés par situation : un futur kit n'a besoin que du champ « situation » dans kits.yml.
    situations_titre: Choisissez la situation de l'enfant
    situations_intro: >-
      Chaque kit commence par expliquer ce que la situation change dans un jeu, puis propose 8 jeux que tout le groupe
      joue ensemble.
    situations:
      - id: vue
        titre_page: "Jeux pour enfants aveugles ou malvoyants, à jouer avec tout le groupe"
        description: "Jeux adaptés pour jouer avec un enfant aveugle ou malvoyant : ballon sonore, balises, jeux d'écoute et de toucher, que tout le groupe joue ensemble."
        intro: "Pour un enfant qui voit peu ou pas, ce n'est pas le jeu qui est difficile, c'est l'information qui manque. Remplacez-la par le son, le toucher et la parole, et il joue comme les autres, souvent mieux qu'eux."
        conseil: "Avant le premier jeu, faites le tour de la salle avec l'enfant, en marchant le long des murs. Et ne déplacez jamais une chaise sans le dire : pour lui, c'est un obstacle invisible."
        nom: La vue
        pour: Un enfant aveugle ou malvoyant.
        detail: Vision floue, champ de vision réduit, gêne à la lumière, ou aucune vision.
        couleur: "#6A4C9C"
        icone: oeil
      - id: audition
        titre_page: "Jeux pour enfants sourds ou malentendants, à jouer avec tout le groupe"
        description: "Jeux adaptés pour jouer avec un enfant sourd ou malentendant : signaux visuels, mime, dessin et jeux d'observation, que tout le groupe joue ensemble."
        intro: "Dans un jeu, presque tout passe par la voix : la règle, le coup de sifflet, le « stop ! ». Donnez aussi ces informations aux yeux, et l'enfant qui entend peu ou pas joue avec les autres, à égalité."
        conseil: "Remplacez le sifflet par un bras levé que tout le groupe reproduit. Il arrête quarante enfants plus vite qu'un coup de sifflet, et personne n'est laissé de côté."
        nom: L'audition
        pour: Un enfant sourd ou malentendant.
        detail: Avec ou sans appareils auditifs ou implant, qui parle, signe ou fait les deux.
        couleur: "#1F7A8C"
        icone: oreille
      - id: motricite
        titre_page: "Jeux pour enfants en fauteuil ou en situation de handicap moteur"
        description: "Jeux adaptés pour jouer avec un enfant en fauteuil, qui marche ou saisit difficilement : jeux assis, de précision et d'équipe, pour tout le groupe."
        intro: "Pour un enfant qui a un handicap moteur, ce n'est presque jamais le jeu entier qui est impossible, c'est un geste. Changez ce geste pour tout le groupe, et le jeu redevient le sien."
        conseil: "Ne poussez jamais un fauteuil sans le demander, et mettez-vous à la hauteur de l'enfant pour lui parler. Pour lui, le fauteuil fait partie de son espace."
        nom: La motricité
        pour: Un enfant en fauteuil, qui marche ou saisit difficilement.
        detail: Fauteuil roulant, béquilles, déambulateur, difficultés à se servir de ses mains.
        couleur: "#B5541C"
        icone: roue
      - id: autisme
        titre_page: "Jeux pour enfants autistes, à jouer avec tout le groupe"
        description: "Jeux adaptés pour jouer avec un enfant autiste : un programme en images, des règles claires, sans élimination et sans contact, pour tout le groupe."
        intro: "Un jeu de groupe est plein de choses que personne n'explique : quand il commence, combien de temps il dure, ce qui se passe si l'on perd. Dites-les clairement, montrez-les, et l'enfant autiste peut profiter du jeu comme les autres."
        conseil: "Prévenez toujours avant de changer : « Dans deux minutes, le jeu est fini. » Un changement annoncé passe beaucoup mieux qu'une surprise."
        nom: L'autisme
        pour: Un enfant autiste.
        detail: Besoin de repères clairs, de prévisibilité et d'un environnement calme.
        couleur: "#2E6E4F"
        icone: repere
      - id: comprehension
        titre_page: "Jeux pour enfants avec une déficience intellectuelle ou une trisomie 21"
        description: "Jeux adaptés pour jouer avec un enfant qui a une déficience intellectuelle : des règles simples, apprises par étapes, sans élimination, pour tout le groupe."
        intro: "Ce qui met en difficulté un enfant qui a une déficience intellectuelle, c'est souvent la règle : trop longue, trop abstraite, expliquée trop vite. Simplifiez-la et apprenez-la en jouant, sans jamais en faire un jeu de tout-petits."
        conseil: "Gardez le même jeu plusieurs séances de suite. C'est en le retrouvant que l'enfant le maîtrise, et qu'il prend plaisir à y gagner."
        nom: La compréhension
        pour: Un enfant qui a une déficience intellectuelle.
        detail: Par exemple avec une trisomie 21. Il apprend à son rythme, avec des règles simples.
        couleur: "#8A3B7A"
        icone: etoile
      - id: attention
        titre_page: "Jeux pour enfants avec un TDAH ou un trouble dys"
        description: "Jeux adaptés pour jouer avec un enfant qui a un TDAH, une dyslexie, une dyspraxie ou une dysphasie : règles courtes, action, aucune lecture obligatoire."
        intro: "L'enfant qui ne tient pas en place pendant l'explication, celui qui bute sur chaque mot d'une carte, celui qui rate toujours le ballon : un jeu bien pensé peut être le moment où il réussit enfin devant les autres."
        conseil: "Expliquez en trente secondes, montrez, et faites jouer tout de suite. Les détails viendront en jouant."
        nom: L'attention et les dys
        pour: Un enfant qui a un TDAH ou un trouble dys.
        detail: Dyslexie, dyscalculie, dyspraxie, dysphasie, troubles de l'attention.
        couleur: "#C0392B"
        icone: cible
      - id: toutes
        titre_page: "Jeux inclusifs à imprimer : les 6 kits Jeux pour tous"
        description: "Les 6 kits Jeux pour tous en une fois : 48 jeux inclusifs pour accueillir un enfant aveugle, sourd, en fauteuil, autiste, avec une déficience intellectuelle, un TDAH ou un trouble dys."
        intro: "Une structure ne sait pas toujours à l'avance quels enfants elle accueillera. Avec les six kits, l'équipe a de quoi préparer l'arrivée de chacun."
        conseil: "Commencez par le chapitre commun, le même dans les six kits : il explique l'esprit des jeux et la rencontre avec la famille, quelle que soit la situation de l'enfant."
        nom: Toutes les situations
        pour: Les six kits en une fois.
        detail: Pour être prêt à accueillir chaque enfant, quelle que soit sa situation.
        couleur: "#1A2340"
        icone: coeur
    ressources_titre: Pour être accompagné
    ressources_intro: >-
      Ces services publics et ces associations informent, accompagnent les familles et aident les structures à accueillir
      un enfant en situation de handicap. Leurs sites sont gratuits à consulter.
    ressources:
      - nom: Mon Parcours Handicap
        url: https://www.monparcourshandicap.gouv.fr/
        icone: mph
        texte: Le site public d'information pour les personnes handicapées et leurs proches.
      - nom: Les Pôles ressources handicap de la Caf
        url: https://www.caf.fr/
        icone: caf
        texte: "Dans de nombreux départements, ils aident les familles et les accueils de loisirs. Renseignez-vous auprès de votre Caf."
      - nom: Fédération Française Handisport
        url: https://www.handisport.org/
        icone: handisport
        texte: Le sport pour les personnes ayant un handicap physique ou sensoriel.
      - nom: Fédération Française du Sport Adapté
        url: https://sportadapte.fr/
        icone: sportadapte
        texte: Le sport pour les personnes ayant un handicap mental ou psychique.
      - nom: Fédération des Aveugles et Amblyopes de France
        url: https://aveuglesdefrance.org/
        icone: aveugles
        texte: Pour les personnes aveugles et malvoyantes et leurs proches.
      - nom: Fédération Nationale des Sourds de France
        url: https://www.fnsf.org/
        icone: fnsf
        texte: Pour les personnes sourdes et la langue des signes française.
      - nom: APF France handicap
        url: https://www.apf-francehandicap.org/
        icone: apf
        texte: Pour les personnes en situation de handicap moteur et leurs familles.
      - nom: Autisme Info Service
        url: https://www.autismeinfoservice.fr/
        icone: autisme
        texte: Écoute, information et orientation gratuites sur l'autisme.
      - nom: Unapei
        url: https://www.unapei.org/
        icone: unapei
        texte: Pour les personnes ayant une déficience intellectuelle et leurs familles.
      - nom: HyperSupers TDAH France
        url: https://www.tdah-france.fr/
        icone: tdah
        texte: Pour les familles d'enfants ayant un TDAH.
      - nom: Fédération Française des DYS
        url: https://www.ffdys.com/
        icone: ffdys
        texte: Pour les personnes ayant un trouble dys et leurs familles.

  - id: professionnels
    nom: Professionnels
    nom_court: Professionnels
    url: /professionnels/
    couleur: pro
    titre_page: "Kits d'animation pour accueils de loisirs, écoles et CSE"
    public: Structures, écoles, associations, CSE
    accroche: "Les outils de direction, les projets, les programmes et les événements d'une structure, prêts à l'emploi."
    description: "Kits et outils pour les professionnels de l'animation : projet pédagogique, livret d'accueil de l'équipe, semaine de vacances, récréation, association de parents, stage sportif, journée familles du CSE."
    intro: >-
      Diriger un accueil, animer une cour d'école, faire vivre une association ou organiser
      l'événement du comité d'entreprise : ce sont des métiers à part entière, avec leurs
      documents, leurs réunions et leurs imprévus. Ces outils ont été écrits par un directeur
      d'accueil de loisirs pour faire gagner du temps aux équipes, sans sacrifier la qualité.
    points:
      - "Des modèles prêts à remplir, en PDF et en Word."
      - "Des méthodes testées sur le terrain, avec les erreurs à éviter."
      - "Tout est inclus dans l'abonnement Pro Structure, pour toute l'équipe."
    publics:
      - id: accueils
        titre: Accueils de loisirs et périscolaire
        texte: >-
          Le projet pédagogique, l'accueil des nouveaux animateurs, le suivi de l'encadrement
          et du budget, et des programmes de vacances prêts à animer.
      - id: ecoles
        titre: Écoles
        texte: >-
          Une cour de récréation plus calme, des grands jeux pour la cour et le sport, et des
          après-midi de fête clés en main pour Noël, le carnaval ou la fin d'année.
      - id: associations
        titre: Associations de parents d'élèves
        texte: >-
          Le bureau, l'assemblée générale, la trésorerie, les démarches et les courriers, et
          les kits pour la kermesse, le carnaval ou le marché de Noël.
      - id: clubs
        titre: Clubs sportifs et centres de vacances
        texte: >-
          Un stage multisport de vacances prêt à animer, des échauffements ludiques et les
          grands jeux collectifs classés par âge.
      - id: cse
        titre: Comités d'entreprise (CSE)
        texte: >-
          La journée familles d'été et l'arbre de Noël clés en main, avec des stands que des
          élus et des bénévoles peuvent tenir sans être animateurs.
