# Pourquoi garder Pro Structure d'une année sur l'autre (page /pro/)
chaque_annee:
  - titre: 12 nouveaux dossiers
    texte: Huit fiches d'animation chaque mois, sur un thème de saison, pour renouveler les mercredis et les vacances.
  - titre: Les nouveaux kits inclus
    texte: Chaque nouveau kit de fête, d'anniversaire ou d'outil pour les structures arrive dans votre bibliothèque dès sa sortie, sans rien payer de plus.
  - titre: Le calendrier de la rentrée
    texte: Une nouvelle édition du calendrier d'animation à chaque rentrée, avec les dates de l'année, des idées de thèmes et les temps forts mois par mois.
  - titre: Des outils à jour
    texte: Le classeur du directeur et les modèles sont mis à jour quand les usages ou les textes changent. Vous téléchargez simplement la nouvelle version.
  - titre: Vos demandes en priorité
    texte: Un thème qui vous manque, un public particulier, un besoin de votre équipe ? Les demandes des structures abonnées passent en premier dans le programme des dossiers.
  - titre: Un prix garanti
    texte: Tant que l'abonnement est renouvelé, son prix ne change pas, même si le tarif public augmente.

# Le programme des dossiers du mois (interne : n'est plus affiché sur le site)
dossiers:
  - [Novembre, "Les jeux des jours de pluie : 8 jeux d'intérieur pour une salle ou un préau"]
  - [Décembre, "Les jeux coopératifs de l'hiver : 8 jeux où l'on gagne tous ensemble"]
  - [Janvier, "Les jeux calmes et les jeux de concentration, pour les retours de vacances"]
  - [Février, "Les jeux d'expression et de théâtre, pour préparer le carnaval"]
  - [Mars, "Les grands jeux de printemps, dehors et en équipes"]
  - [Avril, "Les jeux de piste et d'orientation, du jardin au parc"]
  - [Mai, "Les jeux d'eau et de plein air, pour les premières chaleurs"]
  - [Juin, "Les jeux de fin d'année et les grands défis sportifs de classe ou de centre"]

questions:
  - q: Que contient le dossier du mois ?
    r: >-
      Chaque mois, un dossier PDF de 8 fiches d'animation autour d'un thème (les jours de pluie, les jeux coopératifs, les
      jeux de piste…), avec le même format que les grands jeux : règle à annoncer, matériel, installation, déroulement,
      variantes et conseils. Il arrive dans votre bibliothèque au début du mois.
  - q: Comment reçoit-on les dossiers ? Tout arrive d'un coup ?
    r: >-
      Non, rien n'arrive en pièce jointe. À la souscription, vous recevez un seul mail avec le lien de votre
      bibliothèque, où les fichiers sont rangés par mois et par thème. Avec la formule mensuelle, vous y trouvez le
      dossier du mois en cours, puis un nouveau chaque mois. Avec les formules annuelles et Structure, les dossiers déjà
      parus sont disponibles dès le premier jour, à consulter quand vous en avez besoin. Au début de chaque mois, un
      court mail vous signale le nouveau dossier.
  - q: Mensuel ou annuel ?
    r: >-
      Le mensuel vous laisse essayer sans engagement : vous recevez le dossier du mois et la réduction sur la boutique.
      L'annuel coûte un tiers de moins, inclut le grand fichier des 34 grands jeux et ouvre tous les dossiers déjà parus.
  - q: Faut-il créer un compte ?
    r: >-
      Non. Après le paiement, vous recevez par mail le lien de votre bibliothèque personnelle : tous les fichiers de votre
      formule, et chaque nouveauté au fil des mois. Gardez ce mail, ou ajoutez la page à vos favoris. Pas de mot de passe
      à retenir.
  - q: Comment fonctionne la réduction de 30 % ?
    r: >-
      Elle est réservée aux formules Animateur et s'applique aux kits qui ne sont pas déjà dans votre formule : les kits
      d'anniversaire, de fêtes et de kermesse, et les packs de grands jeux pour la formule mensuelle. Votre code est
      indiqué dans votre bibliothèque. Les outils pour les structures sont réservés à Pro Structure, ou s'achètent à
      l'unité au prix normal.
  - q: Qu'est-ce qu'une « structure » ?
    r: >-
      Un établissement ou une association : un accueil de loisirs, une école, une association de parents d'élèves, un
      club, un comité d'entreprise. Toute l'équipe de cette structure, salariés, animateurs, enseignants et bénévoles,
      peut utiliser et imprimer les fichiers pour ses propres activités, sans limite de nombre. Pour plusieurs
      établissements (une ville, un réseau, une fédération), demandez un devis.
  - q: Que comprend « tout le site » ?
    r: >-
      Tous les kits de la boutique (anniversaires, fêtes, kermesse, grands jeux), tous les outils pour les structures,
      tous les dossiers du mois et le calendrier d'animation. Les kits qui sortent pendant votre abonnement sont inclus
      eux aussi.
  - q: Ma structure peut-elle payer par virement, bon de commande ou mandat administratif ?
    r: >-
      Oui. Écrivez-moi avec le nom et l'adresse de la structure : je vous envoie un devis, puis une facture. Les
      collectivités peuvent régler par mandat administratif ou déposer la facture sur Chorus Pro.
  - q: Comment résilier ?
    r: >-
      Depuis le lien de gestion de l'abonnement envoyé avec votre reçu, à tout moment, en quelques clics. Pour un abonnement annuel, vous pouvez aussi
      m'écrire : le renouvellement est arrêté et vous gardez l'accès jusqu'à la fin de votre année.
  - q: Que se passe-t-il pour les fichiers déjà téléchargés si j'arrête ?
    r: >-
      Vous les gardez et pouvez continuer à les utiliser pour vos activités. Vous perdez seulement l'accès aux nouveautés,
      aux mises à jour et à la réduction.
