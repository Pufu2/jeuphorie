# Jeuphorie Pro : l'abonnement (page /pro/). Les outils pour les structures sont sur la page /professionnels/.
# paiement : lien de paiement Stripe de la formule (https://buy.stripe.com/...), à remplir à l'ouverture.
# Les boutons ne s'activent que si config.yml > boutique > ventes_actives vaut true.
# Les codes de réduction ne sont JAMAIS écrits dans le dépôt : ils sont donnés dans la bibliothèque des abonnés.

page:
  titre_page: "Jeuphorie Pro : l'abonnement des animateurs et des structures"
  description: "Jeuphorie Pro, l'abonnement pour animer toute l'année : un dossier de nouvelles fiches chaque mois, et pour les structures, tout le site inclus pour toute l'équipe, sans limite de personnes."
  chapo: >-
    Un dossier de nouvelles fiches chaque mois pour les animateurs. Et pour les structures, tout le site inclus,
    pour toute l'équipe, sans limite de personnes.

