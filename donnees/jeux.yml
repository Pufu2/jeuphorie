  - 30
  duree: 30
  but: Ramener dans son camp 2 de ses 3 quilles, placées chez l'adversaire, avant l'autre équipe.
  materiel:
  - '6 plots : ce sont les quilles'
  - Un petit objet par joueur, qui compte comme une vie (bout de bois, kapla, domino)
  - Des chasubles de deux couleurs
  organisation: Le terrain est coupé en deux. Les trois quilles de chaque équipe sont posées au fond du
    camp adverse. Chaque équipe a sa zone de défense, qui est la zone d'attaque de l'autre équipe. Dans
