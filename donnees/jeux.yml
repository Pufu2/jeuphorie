# Partie publique des jeux, exportée depuis le dossier des produits (exporter_site.py).
# Ne pas y ajouter les règles des jeux payants.
jeux:
- id: balle-bouclier
  nom: La balle bouclier
  age_min: 6
  packs:
  - 6-9
  - 10-13
  - 14-17
  joueurs:
  - 8
  - 20
  duree: 30
  but: Être la première équipe à toucher tous les joueurs adverses, ou à ramener le drapeau adverse dans
    son camp.
  materiel:
  - Un bouclier par joueur
  - Une balle par joueur (balle de tennis ou balle en mousse)
  - Deux drapeaux
  - Des chasubles de deux couleurs
  organisation: 'Chaque joueur commence dans son camp avec une balle et un bouclier. Un drapeau est placé
    au fond de chaque camp. L''arbitre peut faire revenir en jeu les joueurs touchés quand il le souhaite,
    toujours de manière équitable entre les deux équipes. Au bout d''un certain temps, l''arbitre annonce
    « la charge » : la frontière du milieu disparaît, les joueurs vont partout sur le terrain et le drapeau
    adverse peut être capturé.'
  nb_regles: 6
  nb_variantes: 3
- id: ballon-chasseur
  nom: Le ballon chasseur
  age_min: 6
  packs:
  - 6-9
  joueurs:
  - 8
  - 20
  duree: 20
  but: 'Pour les chasseurs : toucher les autres joueurs, qui deviennent chasseurs à leur tour. Pour les
    autres : rester libre le plus longtemps possible.'
  materiel:
  - Un ballon en mousse
  - Des chasubles pour reconnaître les chasseurs
  organisation: Tous les joueurs sont sur le terrain. Au départ, deux chasseurs ont le ballon et cherchent
    à toucher les autres joueurs.
  nb_regles: 5
  nb_variantes: 0
- id: ballon-prisonnier
  nom: Le ballon prisonnier
  age_min: 6
  packs:
  - 6-9
  - 10-13
  joueurs:
  - 8
  - 20
  duree: 30
  but: Être la première équipe à toucher tous les joueurs adverses.
  materiel:
  - Un ou deux ballons selon le nombre de joueurs
  - Des chasubles de deux couleurs
  organisation: Chaque équipe est dans son camp. L'animateur choisit l'équipe qui commence avec le ballon,
    par tirage au sort ou par un petit défi entre les deux équipes. La prison de chaque équipe se trouve
    derrière le camp adverse.
  nb_regles: 6
  nb_variantes: 0
- id: beret
  nom: Le jeu du béret
  age_min: 6
  packs:
  - 6-9
  joueurs:
  - 6
  - 10
  duree: 20
  but: Ramener le béret dans son camp sans se faire toucher, ou toucher l'adversaire qui essaie de le
    ramener.
  materiel:
  - Un objet qui sert de béret (plot, chasuble ou foulard)
  - Des chasubles de deux couleurs
  organisation: 'Les deux camps se font face, à au moins 10 mètres l''un de l''autre. Le béret est posé
    au milieu. Dans chaque équipe, chaque joueur reçoit un numéro différent. L''animateur annonce un numéro
    : les deux joueurs qui portent ce numéro courent chercher le béret.'
  nb_regles: 4
  nb_variantes: 1
- id: relais-des-epis
  nom: Le relais des épis
  age_min: 6
  packs:
  - 6-9
  joueurs:
  - 8
  - 20
  duree: 10
  but: Être la première équipe à ramasser tous ses épis de maïs dans sa boîte.
  materiel:
  - '10 plots ou bâtons par équipe : ce sont les épis de maïs'
  - Une boîte par équipe
  organisation: Chaque équipe se place derrière sa boîte. Le premier épi est posé entre 5 et 10 mètres,
    les suivants tous les 2 mètres. Au signal, le premier joueur court chercher l'épi de son choix et
    le pose dans la boîte. Dès que l'épi est dans la boîte, le joueur suivant part, et ainsi de suite
    jusqu'au dernier épi.
  nb_regles: 3
  nb_variantes: 2
- id: ballon-anglais
  nom: Le ballon anglais
  age_min: 6
  packs:
  - 6-9
  joueurs:
  - 8
  - 20
  duree: 10
  but: Faire passer le ballon de main en main dans toute son équipe, plus vite que l'équipe adverse.
  materiel:
  - Des ballons variés (rugby, handball, football)
  - Des chasubles de deux couleurs
  organisation: Chaque équipe occupe sa moitié de terrain. Au signal, le lanceur de chaque équipe envoie
    son ballon le plus loin possible dans le camp adverse. Chaque équipe court alors bloquer le ballon
    reçu, se met en file indienne derrière le joueur qui l'a récupéré, puis se passe le ballon de main
    en main, par-dessus la tête ou entre les jambes, jusqu'au dernier joueur. La manche s'arrête quand
    le ballon arrive au dernier joueur. La partie s'arrête quand tout le monde a été lanceur, ou après
    le nombre de manches fixé par l'arbitre.
  nb_regles: 5
  nb_variantes: 3
- id: gendarmes-voleurs
  nom: Gendarmes et voleurs
  age_min: 6
  packs:
  - 6-9
  joueurs:
  - 6
  - 30
  duree: 15
  but: Quand son équipe joue les voleurs, faire passer le plus de trésors possible de la banque jusqu'au
    camp des voleurs.
  materiel:
  - 'Des plots : ce sont les trésors'
  - '5 cerceaux ou plus : ce sont les cachettes'
  - Des chasubles de deux couleurs
  organisation: Les trésors sont dans la banque. Plus loin se trouve le camp des voleurs. Pour l'atteindre,
    les voleurs traversent la zone des gendarmes, où des cachettes leur permettent de se mettre à l'abri.
    Une manche dure 2 à 3 minutes. À la fin, les voleurs comptent les trésors arrivés dans leur camp,
    puis les rôles sont inversés.
  offert: true
  nb_regles: 6
  nb_variantes: 0
  regles:
  - L'équipe qui a rapporté le plus de trésors pendant sa manche de voleurs gagne la partie.
  - Un voleur ne prend qu'un trésor à la fois.
  - Un voleur ne peut être touché que dans la zone des gendarmes, et jamais dans une cachette.
  - Un voleur ne peut être touché que s'il porte un trésor.
  - 'Le trésor reste visible : interdit de le cacher.'
  - Un voleur touché retourne à la banque avec son trésor.
- id: six-planetes
  nom: Les six planètes
  age_min: 6
  packs:
  - 6-9
  joueurs:
  - 8
  - 30
  duree: 30
  but: Détruire les planètes adverses avant que l'autre équipe ne détruise les siennes.
  materiel:
  - '6 plots : ce sont les planètes'
  - 2 ballons ou plus
  - Des chasubles de deux couleurs
  organisation: Chaque équipe défend trois planètes placées dans son camp. Avec les ballons, les joueurs
    essaient de faire tomber les planètes adverses. Une planète détruite ne peut pas être reconstruite.
  nb_regles: 4
  nb_variantes: 2
- id: passe-a-5
  nom: La passe à 5
  age_min: 6
  packs:
  - 6-9
  joueurs:
  - 6
  - 24
  duree: 30
  but: Réussir 5 passes de suite, en recevant chaque fois le ballon dans un cerceau.
  materiel:
  - 1 ballon par match
  - Une trentaine de cerceaux (les planètes) répartis sur tout le terrain
  - Des chasubles pour distinguer les équipes
  organisation: Plusieurs matchs se jouent en même temps sur le même terrain, couvert de cerceaux. Dans
    chaque match, une équipe a le ballon et cherche à se faire des passes en le recevant dans un cerceau.
    Quand elle réussit 5 passes sans que l'adversaire récupère le ballon, elle marque un point.
  nb_regles: 6
  nb_variantes: 5
- id: poules-renards-viperes
  nom: Poules, renards, vipères
  age_min: 6
  packs:
  - 6-9
  joueurs:
  - 12
  - 39
  duree: 20
  but: Les poules attrapent les vipères et fuient les renards. Les renards attrapent les poules et fuient
    les vipères. Les vipères attrapent les renards et fuient les poules.
  materiel:
  - Des plots de trois couleurs pour délimiter les camps
  - Des chasubles de trois couleurs
  organisation: Les trois camps forment un triangle, à une vingtaine de mètres les uns des autres. Chaque
    équipe a son camp. Un joueur qui attrape un adversaire l'emmène dans son camp. Les prisonniers d'une
    même équipe forment une chaîne en se tenant la main ; le premier garde un pied dans le camp où il
    est prisonnier. La chaîne est délivrée quand un coéquipier libre la touche. La partie s'arrête quand
    une équipe est entièrement prisonnière, ou à la fin du temps fixé.
  offert: true
  nb_regles: 7
  nb_variantes: 0
  regles:
  - Chaque équipe ne peut attraper qu'une seule autre équipe, celle qu'elle chasse.
  - Un joueur est attrapé dès que l'adversaire qui le chasse le touche.
  - Dans son propre camp, un joueur ne peut pas être attrapé.
  - Un joueur qui emmène un prisonnier ne peut pas être attrapé pendant le trajet.
  - Quand un joueur touche la chaîne de prisonniers de son équipe, tous sont délivrés.
  points:
  - L'équipe qui attrape tous les adversaires qu'elle chasse gagne.
  - À la fin du temps, l'équipe qui a le plus de prisonniers dans son camp gagne.
