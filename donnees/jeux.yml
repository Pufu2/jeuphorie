  materiel:
  - 4 plots, 2 par équipe
  - Des chasubles de deux couleurs
  organisation: 'Deux équipes se font face, le terrain étant coupé en deux par une ligne médiane. Chaque
    équipe a des défenseurs et des attaquants. Au coup de sifflet, un défenseur et deux attaquants sortent
    de chaque équipe : les attaquants foncent vers le camp adverse pour ramener un plot, pendant que les
