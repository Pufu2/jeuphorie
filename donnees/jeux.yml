- id: barre
  nom: La barre
  age_min: 10
  packs:
  - 10-13
  - 14-17
  joueurs:
  - 8
  - 20
  duree: 30
  but: Faire prisonniers le plus d'adversaires possible.
  materiel:
  - Des chasubles de deux couleurs
  - Des plots pour délimiter les camps et les prisons
  organisation: 'Chaque équipe se place dans son camp. Un joueur va défier un adversaire en criant son
    prénom, à environ un mètre du camp adverse, puis s''enfuit vers son propre camp, sans pouvoir y entrer,
    poursuivi par le joueur défié. Celui-ci a « barre » sur lui : il a le droit de le toucher. Les coéquipiers
    peuvent sortir pour aider. Chaque nouveau joueur qui sort a barre sur tous ceux qui sont sortis avant
    lui.'
  nb_regles: 7
  nb_variantes: 2
- id: duel-au-panier
  nom: Le duel au panier
  age_min: 10
  packs:
  - 10-13
  - 14-17
  joueurs:
  - 3
  - 12
  duree: 20
  but: Marquer avant le joueur qui est devant soi pour l'éliminer, et ne pas se faire éliminer par celui
    qui est derrière.
  materiel:
  - Un panier de basket
  - Deux ballons de basket
  organisation: 'Tous les joueurs sont en colonne derrière la ligne des lancers francs ; les deux premiers
    ont un ballon. Au signal, le premier tire, puis le second tire dès que le premier a lancé. Quand un
    joueur marque, il donne le ballon au premier de la file et va se placer à la fin. Si un joueur marque
    avant celui qui le précède, ce dernier est éliminé : les ballons s''arrêtent et le jeu reprend avec
    les suivants, comme au départ. Quand il ne reste que deux joueurs, celui qui marque revient à la ligne
    des lancers francs, jusqu''à ce qu''un joueur marque deux fois avant l''autre.'
  nb_regles: 3
  nb_variantes: 0
- id: duel-au-panier-geant
  nom: Le duel au panier géant
  age_min: 10
  packs:
  - 10-13
  - 14-17
  joueurs:
  - 15
  - 50
  duree: 30
  but: Monter jusqu'au premier panier et y rester, en marquant avant le joueur qui est devant soi.
  materiel:
  - Au moins 3 paniers de basket, chacun avec une ligne de lancers francs (en ajouter si les joueurs sont
    nombreux)
  - 2 ballons de basket par panier
  organisation: 'Les paniers sont numérotés, le panier 1 étant le plus haut. Les joueurs sont répartis
    au hasard entre les paniers, et on joue au duel au panier sur chacun d''eux. Quand un joueur en élimine
    un autre, il monte d''un panier (du panier 3 au panier 2) ; le joueur éliminé descend d''un panier
    (du panier 3 au panier 4). Au bout du temps fixé, l''animateur siffle et chaque joueur marque des
    points selon son panier : panier 1 = 5 points, panier 2 = 4 points, et ainsi de suite.'
  nb_regles: 2
  nb_variantes: 0
- id: balle-au-capitaine
  nom: La balle au capitaine
  age_min: 10
  packs:
  - 10-13
  - 14-17
  joueurs:
  - 8
  - 20
  duree: 30
  but: Faire une passe à son capitaine pour marquer un point.
  materiel:
  - Une petite balle de rugby
  - 'Deux cerceaux : les zones des capitaines'
  - Des chasubles de deux couleurs
  organisation: 'Deux équipes s''affrontent sur le même terrain. Le capitaine de chaque équipe se tient
    dans sa zone, au bout du terrain, et ne peut pas en sortir. Pour la mise en jeu, la balle est lancée
    au milieu : l''équipe qui la récupère essaie de faire une passe à son capitaine. Après chaque point,
    l''équipe qui l''a encaissé remet en jeu depuis la zone de son capitaine.'
  nb_regles: 7
  nb_variantes: 1
- id: drapeau-double
  nom: Le drapeau double
  age_min: 10
  packs:
  - 10-13
  joueurs:
  - 8
  - 20
  duree: 30
  but: Aller chercher son drapeau et le ramener dans son camp avant que l'autre équipe ne fasse de même.
  materiel:
  - Deux drapeaux
  - Des chasubles de deux couleurs
  - Des plots pour délimiter les camps et la mer
  organisation: 'Les deux équipes se placent chacune sur un côté du terrain. Au coup de sifflet, un joueur
    attaque en courant vers le drapeau, pendant que tous les joueurs adverses essaient de le toucher.
    Un attaquant touché est pris et s''immobilise sur place. L''arbitre annonce ensuite que les rôles
    s''inversent : l''autre équipe attaque et la première défend. Les attaquants suivants peuvent délivrer
    leurs coéquipiers pris, qui délivrent à leur tour ou rentrent au camp. Un attaquant qui entre dans
    la mer, la zone interdite tracée sur le terrain, est pris.'
  nb_regles: 7
  nb_variantes: 0
- id: drapeau-double-ruse
  nom: Le drapeau double rusé
  age_min: 12
  packs:
  - 10-13
  joueurs:
  - 8
  - 20
  duree: 30
  but: Aller chercher son drapeau et le ramener dans son camp avant que l'autre équipe ne fasse de même,
    en trompant les défenseurs.
  materiel:
  - Deux drapeaux
  - Des chasubles de deux couleurs
  - Des plots pour délimiter les camps et la mer
  organisation: 'Les deux équipes se placent chacune sur un côté du terrain. Au coup de sifflet, l''équipe
    qui attaque a 30 secondes pour faire sortir un joueur de sa base vers le drapeau, pendant que tous
    les adversaires défendent. Un défenseur sorti avant l''attaquant ne peut pas le toucher : il doit
    retourner dans sa base avant de revenir dans la partie. Si personne ne sort, ou si plusieurs joueurs
    sortent en même temps, l''attaque est annulée et c''est aussitôt à l''autre équipe d''attaquer. Les
    attaquants suivants peuvent délivrer leurs coéquipiers pris, qui délivrent à leur tour ou rentrent
    au camp. Un attaquant qui entre dans la mer, la zone interdite tracée sur le terrain, est pris.'
  nb_regles: 7
  nb_variantes: 0
- id: epervier-grade
  nom: L'épervier gradé
  age_min: 10
  packs:
  - 10-13
  - 14-17
  joueurs:
  - 8
  - 20
  duree: 30
  but: Éliminer les joueurs adverses pour être la dernière équipe en jeu.
  materiel:
  - Un jeu de 52 cartes
  - Des chasubles de deux couleurs
  organisation: Les deux équipes se font face, chacune à un bout du terrain. Chaque joueur reçoit une
    carte, qu'il garde secrète. Au coup de sifflet, les équipes traversent le terrain en se croisant,
    comme à l'épervier. Quand un joueur touche un adversaire, ils vont tous les deux voir l'arbitre et
    lui montrent discrètement leur carte. Le joueur qui a la plus forte carte retourne jouer ; l'autre
    est éliminé. Après chaque traversée, chaque équipe se concerte pour deviner les cartes adverses et
    préparer la traversée suivante.
  offert: true
  nb_regles: 6
  nb_variantes: 0
  regles:
  - Un joueur éliminé ne communique plus avec son équipe, d'aucune manière, sinon son équipe perd.
  - 'Les cartes suivent l''ordre de la bataille : 2, 3, 4, 5, 6, 7, 8, 9, 10, valet, dame, roi, as.'
  - L'as bat toutes les cartes, sauf le 2.
  - Deux joueurs qui ont la même carte font match nul et retournent dans leur camp. S'ils se touchent
    de nouveau, ils sont éliminés tous les deux.
  - Après 2 traversées sans prise, l'arbitre déclare l'égalité.
  - 'Interdit d''échanger les cartes : chacun garde la sienne toute la partie.'
- id: theque
  nom: La thèque
  age_min: 10
