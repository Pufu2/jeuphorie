  nb_variantes: 0
- id: foot-quilles
  nom: Le foot quilles
  age_min: 8
  packs:
  - 6-9
  - 10-13
  - 14-17
  joueurs:
  - 8
  - 30
  duree: 30
  but: Faire tomber les trois quilles adverses avant que l'autre équipe ne fasse tomber les siennes.
  materiel:
  - '6 plots : ce sont les quilles'
  - 2 ballons de football ou plus
  - Des cerceaux, ou un tracé, autour de chaque quille
  - Des chasubles de deux couleurs
  organisation: 'Le terrain est coupé en deux : chaque équipe défend sa moitié et attaque dans l''autre.
