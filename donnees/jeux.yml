  duree: 30
  but: Faire le plus de tours de terrain possible quand son équipe attaque.
  materiel:
  - 1 raquette de tennis et 1 balle (ou un autre matériel de frappe)
  - '1 cerceau, ou un tracé : la zone du « chien »'
  - Des plots, ou un tracé, pour la zone de frappe, la zone d'attente et les bases
  organisation: 'Deux équipes s''affrontent : l''une attaque, l''autre défend. Un attaquant se prépare
    à frapper la balle, qu''un coéquipier lui lance ; les autres attaquants attendent dans leur zone.
    Un défenseur, le « chien », se place dans le cerceau ; les autres défenseurs se répartissent sur le
    terrain. L''attaquant frappe la balle, puis court pour faire le tour du terrain en passant par les
    bases. Pour l''arrêter, les défenseurs peuvent se passer la balle pour toucher un attaquant qui court
    hors d''une base ; renvoyer la balle au chien le plus vite possible, ce qui arrête le jeu ; ou attraper
    la balle de volée. Dans ce dernier cas, le défenseur pose la balle au sol, les défenseurs courent
    vers le camp, et les attaquants sortent pour prendre la balle et toucher ceux qui n''y sont pas encore
    arrivés.'
  nb_regles: 8
  nb_variantes: 1
