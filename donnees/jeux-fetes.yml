# Jeux de fêtes : jeux complets, offerts et publiés en entier sur le site.
# Ce fichier n'est PAS exporté depuis le dossier privé des produits :
# on le modifie directement ici.
#
# fete : slug d'une fête de donnees/fetes.yml (la page /fetes/<fete>/<id>/ est créée toute seule)
# versions : une version « Dehors » et une version « À l'intérieur »
# ajoute : date de parution du jeu (AAAA-MM-JJ) ; le plus récent paru devient « le jeu offert du mois » de la lettre.
#          Un jeu dont la date est à venir reste caché sur le site et les réseaux jusqu'à ce jour-là.
# Le schéma du terrain (facultatif) se dessine dans outils/schemas_fetes.py, avec le même id.

jeux:

  # ------------------------------------------------------------ Toussaint (automne)
  - id: ecureuils-reserve-hiver
    fete: toussaint
    nom: Les écureuils et la réserve d'hiver
    accroche: Un jeu de ramassage par équipes, où chaque famille d'écureuils remplit son nid avant l'hiver, sous l'œil du renard.
    age_min: 4
    age_max: 10
    ages: [3-5-ans, 6-8-ans, 9-12-ans]
    joueurs: [8, 30]
    duree: 25
    but: Rapporter dans le nid de son équipe le plus de noisettes possible avant que l'hiver arrive, sans se faire attraper par le renard.
    materiel:
      - "40 à 60 « noisettes » : marrons, glands, pommes de pin ramassés en balade, ou à défaut des bouchons ou des balles"
      - "Un nid par équipe : un cerceau, une caisse ou un carton bas"
      - Un foulard ou une chasuble pour le renard
      - "Pour la version à l'intérieur : des cartes noisettes en papier et un chapeau ou un masque de hibou"
    histoire: >-
      Les jours raccourcissent, les feuilles tombent. Dans la forêt, chaque famille d'écureuils se dépêche
      de remplir son nid pour passer l'hiver. Mais un renard rôde entre les arbres, et il adore les écureuils
      un peu trop gourmands.
    versions:
      - lieu: Dehors
        espace: Un jardin, une cour ou un coin de parc, sur une zone de 20 m sur 20 m environ
        mise_en_place: >-
          Délimitez la forêt avec des plots. Posez les nids sur les bords, à égale distance du centre.
          Éparpillez les noisettes dans toute la forêt, en en gardant une poignée de côté pour plus tard.
          Le renard (un adulte au premier tour, puis un enfant) attend au centre.
        deroulement:
          - Au signal, les écureuils partent chercher des noisettes et les rapportent une par une dans leur nid.
          - Le renard essaie de toucher les écureuils qui portent une noisette. Un écureuil touché donne sa noisette au renard, qui la relance dans la forêt.
          - "L'écureuil touché retourne toucher son nid avant de repartir. Le renard n'attrape jamais deux fois de suite le même écureuil."
          - "Toutes les deux ou trois minutes, le meneur crie « Coup de vent ! » : tout le monde rentre au nid, et il éparpille une poignée de noisettes neuves."
          - "Au bout de 15 à 20 minutes, le meneur annonce « L'hiver arrive ! ». On compte les noisettes de chaque nid."
      - lieu: À l'intérieur
        espace: Une salle dégagée ou deux pièces de la maison
        mise_en_place: >-
          Cachez les cartes noisettes un peu partout, à hauteur d'enfant. Le renard devient un hibou,
          assis sur une chaise au milieu de la salle, les yeux fermés.
        deroulement:
          - Les écureuils cherchent les noisettes en marchant et les rapportent une par une au nid.
          - "Quand il le décide, le hibou ouvre les yeux en disant « Hou hou ! » : tout le monde se fige."
          - Le hibou compte jusqu'à 5. Celui qu'il voit bouger rapporte sa noisette au hibou, qui la cachera à nouveau.
          - On joue jusqu'à ce que toutes les noisettes soient trouvées.
    regles:
      - Une seule noisette à la fois.
      - On ne prend jamais une noisette dans le nid d'une autre équipe.
      - Le nid est une maison sûre. Le renard ne touche pas un écureuil qui a un pied dedans.
      - Une noisette tombée en route reste par terre. Elle appartient à celui qui la ramasse.
    adapter:
      - "4-5 ans : pas d'élimination ni de vol. Le renard se contente de faire le tour de la forêt en chantant, et les écureuils se cachent dans leur nid quand il passe tout près."
      - "6-8 ans : le jeu tel quel, avec un renard au premier tour joué par un adulte pour montrer comment on attrape sans pousser."
      - "9-10 ans : trois sortes de noisettes. Le gland vaut 1 point, le marron 2, la pomme de pin 3. Et deux renards au lieu d'un."
    securite:
      - Ramassez les marrons et les pommes de pin sur un sol sans boue ni pente. Retirez les bogues de châtaigne, qui piquent.
      - On touche le dos avec la main, on ne pousse pas et on ne tire pas les vêtements.
    fin: >-
      Avant l'hiver, chaque famille d'écureuils compte sa réserve à voix haute. Puis tout le monde se roule en boule
      et fait semblant de dormir : c'est le moment du goûter, ou du retour au calme.

  - id: herissons-et-tas-de-feuilles
    fete: toussaint
    nom: Les hérissons et les tas de feuilles
    accroche: Un jeu coopératif pour les petits, où personne ne reste dehors quand le vent se lève.
    age_min: 3
    age_max: 7
    ages: [3-5-ans, 6-8-ans]
    joueurs: [5, 25]
    duree: 15
    but: Quand le vent se lève, trouver un abri dans un tas de feuilles, et faire en sorte que tous les hérissons soient à l'abri, même quand il reste peu de tas.
    materiel:
      - "Des cerceaux, des tapis ou de grands cartons : ce sont les tas de feuilles (un pour trois enfants au départ)"
      - Une musique douce et de quoi l'arrêter, ou un tambourin
      - "Facultatif : de vraies feuilles mortes dans un sac, à éparpiller dans les tas pour le décor"
    histoire: >-
      En automne, les hérissons se promènent dans le jardin pour trouver de quoi manger. Mais quand le vent
      se lève, ils courent se mettre à l'abri sous un tas de feuilles. Et un bon hérisson ne laisse jamais
      un ami dehors.
    versions:
      - lieu: Dehors
        espace: Une pelouse ou une cour, 10 m sur 10 m suffisent
        mise_en_place: >-
          Posez les tas de feuilles un peu partout dans l'espace, à au moins 2 m les uns des autres.
          Les hérissons se promènent autour, à quatre pattes pour les plus petits ou en marchant tout doucement.
        deroulement:
          - Pendant la musique (ou le tambourin), les hérissons se promènent en cherchant à manger.
          - "Le meneur arrête la musique et crie « Le vent se lève ! » : chacun court s'abriter dans un tas de feuilles."
          - Plusieurs hérissons peuvent partager le même tas, à condition d'avoir au moins un pied ou une main dedans.
          - Le meneur retire un tas à chaque tour. Personne n'est éliminé, on se serre de plus en plus.
          - Au dernier tour, il ne reste qu'un ou deux tas, et tout le groupe doit tenir dedans en se roulant en boule.
      - lieu: À l'intérieur
        espace: Une salle de motricité, une salle de classe poussée ou un grand salon
        mise_en_place: >-
          Remplacez les cerceaux par des tapis, des coussins ou des serviettes. Retirez les objets sur lesquels on peut glisser.
        deroulement:
          - Même jeu que dehors, en marchant à quatre pattes ou en « pas de hérisson », les mains sur les genoux.
          - "Ajoutez d'autres appels que le vent : « La pluie ! », on se fait tout petit sous ses bras ; « Le soleil ! », on s'étire ; « Le renard ! », on ne bouge plus du tout."
    regles:
      - Personne n'est éliminé.
      - Un hérisson à l'abri aide les autres à entrer dans son tas.
      - On ne court vers les tas qu'après l'appel du vent.
    adapter:
      - "3-4 ans : un adulte joue avec eux et montre les gestes. On retire un tas seulement tous les deux tours."
      - "5-7 ans : on chronomètre le dernier tour. Le groupe a 10 secondes pour que tout le monde soit à l'abri."
    securite:
      - Les cerceaux posés au sol glissent sur le carrelage. Préférez des tapis à l'intérieur.
      - Au dernier tour, rappelez qu'on se serre sans s'écraser. Un adulte reste tout près.
    fin: >-
      Quand tous les hérissons tiennent dans le dernier tas, le meneur raconte que l'hiver est arrivé
      et que les hérissons s'endorment jusqu'au printemps. Une minute de silence, couchés, avant de se relever doucement.

  # ------------------------------------------------------------ Noël
  - id: tournee-du-pere-noel
    fete: noel
    nom: La tournée du père Noël
    accroche: Un relais où chaque lutin livre les cadeaux dans la bonne maison. Des petits aux grands-parents.
    age_min: 4
    age_max: 99
    ages: [3-5-ans, 6-8-ans, 9-12-ans]
    joueurs: [4, 30]
    duree: 20
    but: Livrer tous les cadeaux de sa hotte dans la bonne maison avant l'équipe adverse.
    materiel:
      - "Une hotte par équipe : un sac ou un panier"
      - "10 à 20 « cadeaux » par équipe : petites boîtes ou objets emballés dans du papier journal, avec une étiquette"
      - "Autant de « maisons » que d'étiquettes différentes : des cartons, des chaises ou des cerceaux, avec la même étiquette"
      - Un bonnet de père Noël par équipe, que porte le joueur en train de livrer
    histoire: >-
      Le père Noël s'est fait mal au dos en descendant une cheminée. Ce soir, ce sont les lutins
      qui font la tournée. Mais attention : chaque cadeau doit arriver dans la bonne maison.
    versions:
      - lieu: Dehors
        espace: Jardin, cour ou parc
        mise_en_place: >-
          Placez les maisons un peu partout, entre 5 et 20 m du traîneau, le point de départ des équipes.
          Chaque maison porte une étiquette (un chiffre, une couleur ou un dessin). Les cadeaux de chaque équipe
          ont la couleur de l'équipe et les mêmes étiquettes que les maisons.
        deroulement:
          - Les équipes sont en file derrière le traîneau, leur hotte devant elles.
          - Le premier lutin met le bonnet, prend un cadeau dans la hotte, le livre dans la maison qui a la même étiquette et revient.
          - Il donne le bonnet au suivant, qui part à son tour.
          - Un cadeau livré dans la mauvaise maison est rapporté au traîneau par le lutin contrôleur (un adulte). Il faudra le livrer à nouveau.
          - La première équipe dont la hotte est vide a gagné.
      - lieu: À l'intérieur
        espace: Toute la maison, ou une salle avec des coins bien séparés
        mise_en_place: >-
          Les maisons sont réparties dans plusieurs pièces, qui deviennent des villes. Pour les plus grands,
          remplacez l'étiquette par une adresse à deviner : « la maison au pied du sapin », « la maison qui sent bon le gâteau ».
        deroulement:
          - "Même jeu que dehors, mais on livre en marchant : un lutin qui court laisse sa place au suivant."
          - On peut jouer avec une seule équipe contre la montre. La famille essaie de battre son record à chaque partie.
    regles:
      - Un seul cadeau à la fois.
      - Le cadeau est posé dans la maison, jamais lancé.
      - Seul le lutin qui porte le bonnet peut livrer.
    adapter:
      - "3-5 ans : des étiquettes en couleurs ou en dessins, et un grand qui accompagne chaque petit lutin."
      - "6-9 ans : des chiffres, ou des additions dont le résultat donne le numéro de la maison (3 + 4 = maison 7)."
      - "Avec les grands-parents : ils tiennent les maisons et vérifient les livraisons. Ils peuvent aussi jouer un lutin sur deux, en marchant."
    securite:
      - Aucune maison près de l'escalier ou du sapin décoré, pour éviter les chutes et la casse.
    fin: >-
      Le dernier cadeau livré, le père Noël appelle les lutins (un adulte, avec ou sans barbe) :
      chaque équipe reçoit son diplôme de lutin livreur.

  - id: rennes-egares
    fete: noel
    nom: Les rennes égarés
    accroche: Une chasse au trésor où chaque renne retrouvé donne une lettre du mot mystère.
    age_min: 4
    age_max: 99
    ages: [3-5-ans, 6-8-ans, 9-12-ans]
    joueurs: [2, 20]
    duree: 30
    but: Retrouver tous les rennes du père Noël, reconstituer le mot mystère et découvrir où se cache le traîneau.
    materiel:
      - "5 à 8 rennes en papier (dessinés et découpés), qui portent chacun une lettre au dos"
      - "Un mot mystère qui donne la cachette finale, par exemple SAPIN, BUFFET, GARAGE ou CABANE"
      - "Une « étable » : une boîte où l'on range les rennes retrouvés"
      - "Une surprise dans la cachette finale : le goûter, des papillotes ou un petit cadeau commun"
      - Des pinces à linge pour accrocher les rennes, dehors
    histoire: >-
      Pendant la nuit, la porte de l'étable est restée ouverte et les rennes se sont échappés.
      Sans eux, le traîneau ne peut pas partir. Il faut tous les retrouver avant ce soir.
    versions:
      - lieu: Dehors
        espace: Jardin ou parc, sur une zone que l'on voit en entier
        mise_en_place: >-
          Accrochez les rennes avec des pinces à linge, à hauteur d'enfant : à une branche, une clôture,
          une poignée de porte. Pour les plus grands, chaque renne porte au recto une indication pour trouver
          le suivant, le premier étant remis au départ.
        deroulement:
          - Les enfants cherchent les rennes et les ramènent un par un à l'étable.
          - "Quand tous les rennes sont rentrés, on retourne les cartes : chaque renne a une lettre."
          - On remet les lettres dans l'ordre pour former le mot mystère, puis on court à la cachette.
      - lieu: À l'intérieur
        espace: La maison, ou une salle avec des recoins
        mise_en_place: >-
          Cachez les rennes dans plusieurs pièces, à des endroits sûrs : sous un coussin, dans une botte,
          derrière un cadre. Pour enchaîner, chaque renne indique la pièce du suivant.
        deroulement:
          - Même jeu que dehors, en marchant.
          - "Pour les grands, les indications deviennent des devinettes : « Je suis froid dedans et je ronronne la nuit » (le réfrigérateur)."
          - Les petits cherchent avec un adulte qui dit « tu chauffes » ou « tu refroidis ».
    regles:
      - Les rennes retrouvés vont tout de suite à l'étable.
      - On ne regarde les lettres que quand tous les rennes sont rentrés.
      - "En équipes : chaque équipe a des rennes d'une couleur et ne ramène que les siens."
    adapter:
      - "3-5 ans : 4 ou 5 rennes bien visibles, et un mot court (SAPIN). L'adulte lit les lettres avec eux."
      - "6-8 ans : 6 à 8 rennes et un parcours où chaque renne indique où chercher le suivant."
      - "9-12 ans : les devinettes, et des lettres dans le désordre. Ajoutez un renne piège qui porte une lettre en trop."
    securite:
      - Rien de caché en hauteur, dans un placard à produits ménagers, ni près du four ou de la cheminée.
    fin: >-
      Dans la cachette, une lettre du père Noël remercie les enfants d'avoir sauvé la tournée,
      et la surprise se partage entre tous.


  - id: grelots-du-pere-noel
    fete: noel
    ajoute: 2026-10-20
    nom: Les grelots du père Noël
    accroche: Un jeu de silence et d'adresse, où les lutins reprennent un à un les grelots du traîneau sans réveiller le père Noël.
    age_min: 4
    age_max: 11
    ages: [3-5-ans, 6-8-ans, 9-12-ans]
    joueurs: [5, 20]
    duree: 20
    but: Rapporter tous les grelots du traîneau dans la hotte des lutins sans réveiller le père Noël, qui somnole au milieu de la salle.
    materiel:
      - "6 à 10 grelots, clochettes ou petites boîtes remplies de riz, qui font du bruit quand on les bouge"
      - Un foulard pour bander les yeux du père Noël, ou un bonnet enfoncé jusqu'au nez
      - Une chaise ou un coussin pour le père Noël
      - "Une hotte : un panier, un sac ou un carton"
    histoire: >-
      Après une nuit entière à préparer la tournée, le père Noël s'est endormi au pied de son traîneau. Mais les grelots
      sont tombés tout autour de lui, et sans eux, les rennes ne sauront pas où aller dans le brouillard. Les lutins vont
      les reprendre un par un, sur la pointe des pieds. S'il se réveille, il voudra savoir qui fait tout ce bruit.
    versions:
      - lieu: À l'intérieur
        espace: "Une salle ou un salon dégagé, au calme : c'est le jeu idéal après le goûter ou avant le coucher"
        mise_en_place: "Le père Noël s'assoit au centre, les yeux bandés. Posez les grelots en cercle autour de lui, à un ou deux pas. Les lutins s'assoient en grand cercle, à quatre ou cinq mètres, avec la hotte."
        deroulement:
          - "L'animateur désigne un lutin du doigt, sans un mot. Le lutin s'approche, prend un grelot et le rapporte dans la hotte."
          - "Si le père Noël entend un bruit, il tend le bras dans sa direction en disant « Ho ho ho ! ». S'il montre bien le lutin, celui-ci repose le grelot et retourne s'asseoir."
          - "Un lutin qui a rapporté un grelot dans la hotte devient le prochain père Noël, ou désigne le suivant."
      - lieu: Dehors
        espace: Un coin d'herbe ou de cour abrité du vent, où l'on s'entend bien
        mise_en_place: "Même installation, avec un cercle plus grand et des grelots plus bruyants. Le père Noël peut se tenir debout, adossé à un arbre."
        deroulement:
          - "Deux lutins partent en même temps, de deux côtés opposés : le père Noël doit choisir lequel il a entendu."
          - "Le père Noël a trois « Ho ho ho ! » par manche. Quand il les a utilisés, les lutins ont le champ libre."
          - "La manche se termine quand tous les grelots sont dans la hotte, ou quand le père Noël a renvoyé trois lutins."
    regles:
      - On marche, on ne court jamais.
      - "Le père Noël garde les yeux bandés et montre du bras, sans se lever."
      - "Les lutins qui attendent ne font aucun bruit : c'est tout le groupe qui aide le lutin en mission."
      - "Un grelot qui tinte n'est pas un échec : seul le bras du père Noël, bien pointé, renvoie un lutin."
    adapter:
      - "3-5 ans : un adulte joue le père Noël et se trompe souvent de direction. Les grelots sont gros et faciles à prendre."
      - "6-8 ans : le jeu tel quel. Le lutin qui rapporte un grelot devient le père Noël."
      - "9-12 ans : grelots à rapporter dans l'ordre (du plus petit au plus gros), ou deux grelots attachés ensemble par un fil, à ne pas faire tinter."
    securite:
      - "Rien par terre entre le cercle et le père Noël : on enlève chaises, sacs et jouets."
      - Un enfant qui n'aime pas avoir les yeux bandés peut fermer les yeux, ou garder un bonnet sur les yeux sans foulard.
    fin: "Quand la hotte est pleine, le père Noël « se réveille », compte les grelots avec les lutins et les remercie : grâce à eux, les rennes trouveront leur chemin. Un dernier « Ho ho ho ! » à voix basse, et c'est l'heure de l'histoire du soir."

  - id: attelage-du-pere-noel
    fete: noel
    ajoute: 2026-11-20
    nom: L'attelage du père Noël
    accroche: Un jeu de rassemblement pour les petits, où les rennes rejoignent le père Noël un par un, jusqu'à ce que tout l'attelage puisse partir en tournée.
    age_min: 3
    age_max: 7
    ages: [3-5-ans, 6-8-ans]
    joueurs: [6, 25]
    duree: 15
    but: Former tous ensemble l'attelage du père Noël, renne après renne, puis faire la tournée des toits sans que l'attelage se coupe.
    materiel:
      - Une clochette, un grelot ou un tambourin pour le père Noël
      - Un bonnet de père Noël
      - "5 à 8 « toits » : des cerceaux, des tapis ou des doubles pages de journal posés au sol"
      - "Facultatif : des bois de renne en carton, agrafés sur une bande de papier autour de la tête"
    histoire: >-
      Le soir de Noël, les rennes broutent tranquillement dans la grande prairie du pôle Nord. Quand la clochette sonne,
      ils savent que l'heure est venue : le père Noël les appelle un par un pour les atteler au traîneau. Mais un attelage
      ne décolle que si tous les rennes sont là, bien accrochés les uns aux autres.
    versions:
      - lieu: Dehors
        espace: Une cour ou une pelouse plate, 15 m sur 15 m environ
        mise_en_place: >-
          Délimitez la prairie avec des plots et posez les toits un peu partout, bien espacés. Le père Noël (un adulte
          au premier tour) se tient au bord, avec son bonnet et sa clochette. Les rennes se dispersent et broutent, à quatre
          pattes ou debout en mâchonnant. Appelez les plus timides en premier : ils seront juste derrière le père Noël,
          et ce sont les plus remuants qui fermeront la marche.
        deroulement:
          - "Le père Noël sonne la clochette et appelle : « Les rennes qui ont des chaussures à scratch ! » Ces rennes trottent jusqu'à lui et s'accrochent derrière, les mains sur les épaules de celui de devant."
          - "Entre deux appels, l'attelage fait un petit tour au pas dans la prairie, en contournant les rennes qui broutent encore. À chaque coup de clochette, tout l'attelage répond « Ding ding ! »."
          - "Le père Noël continue avec des indices que tout le monde peut voir : un pull rouge, une écharpe, des cheveux attachés, des chaussettes qui dépassent."
          - "Le dernier appel est toujours « Tous les rennes qui restent ! », pour que personne n'attende seul au milieu de la prairie."
          - "L'attelage complet fait la tournée. À chaque toit, il s'arrête, tape trois fois des pieds et crie « Ho ho ho ! » pour déposer un cadeau imaginaire. S'il se coupe, il attend le renne décroché avant de repartir."
          - Après le dernier toit, le père Noël dételle les rennes un par un en les remerciant. Le premier renne dételé devient le père Noël de la partie suivante.
      - lieu: À l'intérieur
        espace: Une salle de motricité ou un grand salon débarrassé
        mise_en_place: >-
          Les toits sont des tapis ou des coussins posés au sol, à au moins un mètre des murs. Les rennes broutent assis ou
          à quatre pattes. Au-delà de huit rennes, un attelage tourne mal dans une pièce : faites deux traîneaux, avec deux pères Noël.
        deroulement:
          - Même jeu que dehors, au pas de renne, en levant bien les genoux.
          - "Pendant la tournée, le père Noël annonce la météo : « Du vent ! » (on avance penché), « Du brouillard ! » (tout petits pas), « Un toit glissant ! » (on s'arrête sans se lâcher)."
          - "Avec deux traîneaux, les deux attelages se croisent sans se toucher et se saluent d'un « Joyeux Noël ! »."
    regles:
      - On ne rejoint l'attelage que quand on est appelé.
      - Les mains restent sur les épaules du renne de devant, sans tirer ni pousser.
      - L'attelage avance au pas, à la vitesse du plus petit renne.
      - "Personne n'est éliminé : tous les rennes finissent attelés."
    adapter:
      - "3-4 ans : le père Noël appelle chaque renne par son prénom, et l'attelage se fait en se donnant la main plutôt qu'en se tenant par les épaules. Trois toits suffisent."
      - "5-6 ans : le jeu tel quel, avec les appels par indice et la météo pendant la tournée."
      - "6-7 ans : une variante de poursuite douce. Les rennes qui broutent s'échappent en marchant vite, et seul le père Noël, en tête de l'attelage, peut les toucher. Un renne touché s'accroche en queue. La partie finit quand tout le monde est attelé."
    securite:
      - "Un attelage trop long fait le fouet : dans les virages, les derniers sont tirés et tombent. Au-delà de huit ou dix enfants, coupez en deux traîneaux et tournez large."
      - Pas de bois de renne qui glissent sur les yeux. À l'intérieur, retirez les toits en papier qui glissent sur le carrelage.
    fin: >-
      Les rennes dételés rentrent à l'étable : un grand tapis ou le coin du goûter. Ils s'allongent, les yeux fermés, pendant
      que le père Noël passe de l'un à l'autre en les remerciant pour la tournée. Il fait tinter sa clochette une dernière fois,
      de plus en plus doucement, et l'on se relève quand on ne l'entend plus.

  # ------------------------------------------------------------ Carnaval
  - id: defile-des-statues
    fete: carnaval
    nom: Le défilé des statues
    accroche: Un défilé costumé en musique, puis des statues à tenir. Personne n'est éliminé.
    age_min: 3
    age_max: 12
    ages: [3-5-ans, 6-8-ans, 9-12-ans]
    joueurs: [4, 40]
    duree: 20
    but: Défiler en rythme, puis tenir la pose annoncée sans bouger quand la musique s'arrête.
    materiel:
      - Une musique entraînante et de quoi l'arrêter (enceinte ou téléphone)
      - "12 cartes « pose » : le roi fier, le lion qui rugit, le robot, la ballerine, le super-héros qui s'envole, le pirate, la sorcière, l'arbre dans le vent…"
      - Des gommettes ou des rubans pour les prix de la fin
      - "Dehors : des instruments maison (boîtes de conserve, bouteilles de riz, casseroles)"
    histoire: >-
      Le défilé du carnaval traverse la ville. Mais chaque fois que la musique s'arrête, une fée
      transforme tout le cortège en statues.
    versions:
      - lieu: Dehors
        espace: Une cour, une rue fermée à la circulation, un parc
        mise_en_place: >-
          Tracez un parcours de défilé avec des plots : une boucle, un huit ou un serpentin. Un adulte tient la musique
          et les cartes. Deux ou trois enfants commencent comme juges.
        deroulement:
          - Le cortège défile sur le parcours en musique, avec les instruments.
          - La musique s'arrête et l'adulte montre une carte pose. Tout le monde prend la pose et ne bouge plus.
          - Les juges passent entre les statues. Celle qui bouge ou qui rit devient juge au tour suivant, et un juge reprend sa place dans le défilé.
          - On recommence, avec un nouveau rythme de musique et une nouvelle pose.
      - lieu: À l'intérieur
        espace: Une salle dégagée ou un grand salon
        mise_en_place: >-
          Le défilé se fait en ronde autour de la pièce. Retirez les objets fragiles et le tapis qui glisse.
        deroulement:
          - Même jeu que dehors. Variez la façon de défiler en annonçant la consigne en même temps que la musique repart.
          - "Exemples : en marchant sur la pointe des pieds, comme un géant, à reculons doucement, en se tenant par les épaules."
          - Pour les petits, les statues peuvent se faire assises ou allongées.
    regles:
      - On ne bouge plus dès que la musique s'arrête.
      - Une statue qui bouge devient juge pour un tour, puis revient dans le défilé.
      - Les juges peuvent faire des grimaces, mais ne touchent pas les statues.
    adapter:
      - "3-5 ans : 4 ou 5 poses seulement, montrées par l'adulte qui les fait aussi. Personne ne devient juge."
      - "6-8 ans : le jeu tel quel."
      - "9-12 ans : des poses à plusieurs (« une photo de famille », « un bateau de pirates ») à former en 10 secondes."
    securite:
      - Un sol qui ne glisse pas, surtout avec des costumes longs. Pas de masque qui gêne la vue pendant le défilé.
    fin: >-
      Chaque juge remet un ruban : la statue la plus drôle, la plus élégante, la plus effrayante, la plus solide.
      Prévoyez assez de prix pour que chacun en reçoive un.

  - id: mannequin-du-carnaval
    fete: carnaval
    nom: Le mannequin du carnaval
    accroche: Un relais où chaque équipe habille son mannequin vivant, puis le fait défiler.
    age_min: 5
    age_max: 12
    ages: [3-5-ans, 6-8-ans, 9-12-ans]
    joueurs: [6, 30]
    duree: 20
    but: Apporter un à un tous les accessoires de la malle pour habiller son mannequin avant l'autre équipe.
    materiel:
      - "Une malle ou un sac par équipe, avec les mêmes accessoires : chapeau, lunettes, cape ou écharpe, collier, gants, nœud papillon, perruque…"
      - Un mannequin vivant par équipe (un enfant volontaire ou un adulte)
      - "Dehors : des plots et des cerceaux pour le parcours"
    histoire: >-
      Le grand défilé commence dans cinq minutes, et les mannequins de la vitrine ne sont pas prêts.
      Chaque équipe de costumiers doit les habiller à temps.
    versions:
      - lieu: Dehors
        espace: Une cour ou un jardin, 10 à 15 m entre le départ et le mannequin
        mise_en_place: >-
          Les équipes sont en file sur la ligne de départ, avec leur malle à côté d'elles. Leur mannequin
          se tient debout, immobile, à 10 ou 15 m. Entre les deux, posez un petit parcours : un slalom, un cerceau où sauter.
        deroulement:
          - Le premier joueur prend un seul accessoire dans la malle, fait le parcours et le met au mannequin.
          - Il revient en courant tout droit et tape dans la main du suivant.
          - Le mannequin n'a pas le droit d'aider. Il peut seulement baisser la tête ou tendre les bras.
          - Quand la malle est vide, toute l'équipe court rejoindre son mannequin et le fait défiler.
      - lieu: À l'intérieur
        espace: Une salle ou un salon, 4 à 6 m suffisent
        mise_en_place: >-
          Même installation, sans parcours. Pour éviter les courses, chacun se déplace d'une façon imposée.
        deroulement:
          - "À l'aller, on marche avec l'accessoire posé sur la tête. S'il tombe, on le remet et on continue."
          - "Au retour, on revient en marche de canard, à cloche-pied ou à reculons. L'adulte change la consigne à chaque tour."
    regles:
      - Un seul accessoire par voyage.
      - L'accessoire est mis sur le mannequin, pas seulement posé à ses pieds.
      - Le joueur suivant ne part qu'après avoir été touché dans la main.
    adapter:
      - "5-6 ans : des accessoires faciles à mettre (chapeau, collier, écharpe), et un adulte comme mannequin."
      - "7-9 ans : le jeu tel quel."
      - "10-12 ans : des cartes devinettes à la place des accessoires (« quelque chose pour avoir chaud au cou »). Il faut trouver le bon objet dans la malle."
    securite:
      - Rien de pointu ni de fragile dans la malle. Pas de lunettes en verre.
    fin: >-
      Les mannequins habillés défilent devant tout le monde, et chaque équipe présente son personnage
      en une phrase : « Voici Lady Paillette, reine du carnaval ! »

  - id: marche-des-masques
    fete: carnaval
    ajoute: 2026-12-20
    nom: Le marché des masques
    accroche: Un jeu de ramassage et d'échange par équipes, où chaque morceau trouvé rapproche du masque complet, à condition de savoir troquer au bon moment.
    age_min: 6
    age_max: 12
    ages: [6-8-ans, 9-12-ans]
    joueurs: [8, 32]
    duree: 30
    but: Assembler avec son équipe le plus de masques complets possible, chacun fait d'yeux, d'un nez, d'une bouche et d'un chapeau de la même couleur.
    materiel:
      - "64 cartes « morceau de masque » : 4 couleurs, et pour chaque couleur 4 yeux, 4 nez, 4 bouches et 4 chapeaux, dessinés au feutre. Le carton des boîtes de céréales tient bien sous la pluie et dans les poches."
      - "Le marché : une table, un banc ou un carton retourné, au centre"
      - "Un camp par équipe : un cerceau, une caisse ou une nappe posée au sol"
      - Des foulards ou des chasubles pour reconnaître les équipes
      - Un sifflet ou un tambourin
    histoire: >-
      La veille du carnaval, un coup de vent a renversé l'atelier du fabricant de masques. Les morceaux se sont envolés
      dans toute la ville : des yeux dans les buissons, des nez sur les bancs, des chapeaux partout. Chaque équipe de costumiers
      récupère ce qu'elle peut, et au marché, on échange ce qui ne sert pas.
    versions:
      - lieu: Dehors
        espace: Une cour ou un jardin avec des recoins, 20 m sur 20 m environ
        mise_en_place: >-
          Posez le marché au centre, avec 4 cartes faces visibles. Placez un camp dans chaque coin. Dispersez les autres cartes
          face cachée dans tout l'espace : au pied d'un arbre, sous un plot, contre un mur. Gardez une quinzaine de cartes
          dans votre poche, pour relancer la partie en cours de route.
        deroulement:
          - Au signal, les joueurs partent chercher les cartes. On en ramasse une seule à la fois, sans la regarder, et on la rapporte au camp avant de la retourner.
          - "Au camp, l'équipe range ses morceaux par couleur. Dès que quatre morceaux différents de la même couleur sont réunis, elle les empile : c'est un masque complet, et il ne bouge plus."
          - "Un morceau en double peut partir au marché. Le joueur y dépose sa carte face visible et repart avec une des cartes posées. Un seul échange par voyage."
          - "Toutes les cinq minutes environ, le meneur siffle « Coup de vent ! » : il cache quelques cartes neuves dans la ville et en ajoute deux au marché."
          - Au bout de 20 minutes, ou quand il ne reste plus de cartes à trouver, le meneur siffle la fin. On compte les masques complets de chaque équipe.
      - lieu: À l'intérieur
        espace: Deux ou trois pièces, ou une grande salle avec du mobilier
        mise_en_place: >-
          Cachez les cartes à hauteur d'enfant : sous un coussin, entre deux livres, derrière un rideau. Le marché est sur une
          table au milieu de la pièce principale, et chaque équipe s'installe autour d'une chaise ou d'un coin de table.
        deroulement:
          - "On se déplace en marchant. Un joueur qui court rapporte sa carte au marché sans rien prendre en échange."
          - "Pour éviter les embouteillages, un seul joueur par équipe va au marché à la fois : c'est le marchand, et il change à chaque échange."
          - Dans une petite salle, jouez à deux équipes avec deux couleurs seulement, soit 32 cartes.
    regles:
      - Une carte à la fois, et on ne la regarde qu'une fois arrivé au camp.
      - On ne prend jamais de carte dans le camp d'une autre équipe.
      - Au marché, on dépose d'abord et on prend ensuite. On ne reprend pas la carte qu'on vient de poser.
      - Un masque complet compte quatre morceaux différents (yeux, nez, bouche, chapeau) de la même couleur.
    adapter:
      - "6-7 ans : on oublie les couleurs. Un masque, ce sont simplement quatre morceaux différents, et le marché sert à échanger un deuxième nez contre une bouche."
      - "8-9 ans : le jeu tel quel."
      - "10-12 ans : les équipes peuvent troquer entre elles, au marché seulement, carte contre carte, si les deux sont d'accord. Un masque d'une seule couleur vaut 2 points, un masque arc-en-ciel (quatre morceaux de quatre couleurs) vaut 1 point."
    securite:
      - Rien de caché près de la rue, d'un point d'eau, en hauteur ou derrière une porte qui claque.
      - "Tout le monde se croise au marché : demandez de ralentir à deux pas de la table."
    fin: >-
      Chaque équipe pose ses masques complets à plat devant elle, et l'on compte ensemble à voix haute. L'équipe qui en a le plus
      choisit la première chanson du bal, les autres choisissent les suivantes, dans l'ordre. Rangez les cartes dans une enveloppe
      par couleur : le jeu ressert d'une année sur l'autre.

  - id: cape-du-roi-carnaval
    fete: carnaval
    ajoute: 2027-01-20
    nom: La cape du roi Carnaval
    accroche: Un jeu coopératif autour d'un grand drap, pour les petits. On fait danser les confettis, on change de place en dessous, et personne n'attend sur le côté.
    age_min: 3
    age_max: 7
    ages: [3-5-ans, 6-8-ans]
    joueurs: [4, 16]
    duree: 20
    but: Tenir tous ensemble la grande cape du roi Carnaval et réussir, sans la lâcher, les défis qu'il propose, jusqu'à se retrouver tous assis sous la tente du carnaval.
    materiel:
      - "Un grand drap, une nappe ou une couverture légère d'au moins 2 m sur 2 m : c'est la cape. Un vieux drap de lit à deux places convient pour une douzaine d'enfants."
      - "Une vingtaine de boules de papier froissé de toutes les couleurs (papier de soie, crépon, journal peint) : ce sont les confettis"
      - Un ballon de baudruche gonflé à moitié, ou une balle légère en mousse
      - Une couronne en carton pour le roi Carnaval, l'adulte qui mène le jeu
      - Une musique et de quoi l'arrêter
    histoire: >-
      Pour le défilé, le roi Carnaval s'est fait coudre une cape immense, si grande qu'il ne peut pas la porter tout seul.
      Il lui faut tout un cortège pour la tenir. Et quand le cortège la secoue, les confettis posés dessus se mettent à danser.
    versions:
      - lieu: Dehors
        espace: Une pelouse ou une cour à l'abri du vent, 6 m sur 6 m suffisent
        mise_en_place: >-
          Étalez la cape au sol. Les enfants se placent tout autour et attrapent le bord à deux mains, en le serrant dans les
          poings. Le roi Carnaval tient un coin, comme les autres, et annonce les défis. Les confettis attendent dans un panier.
        deroulement:
          - "Pour commencer, la cape fait la mer calme (petites vagues), puis la tempête (grandes vagues), puis elle s'envole : tout le monde lève les bras en même temps et la laisse redescendre doucement."
          - "Le roi jette les confettis sur la cape. En musique, on les fait danser sans qu'ils tombent. Quand la musique s'arrête, on compte ensemble ceux qui sont restés dessus."
          - "Le défi inverse : on secoue pour faire tomber tous les confettis, puis on les ramasse et on les remet dans le panier avant que le roi ait compté jusqu'à 10."
          - "Le changement de place : la cape monte bien haut et le roi annonce « Tous ceux qui ont des chaussettes bleues ! ». Ces enfants passent dessous en marchant et vont prendre une autre place autour de la cape, avant qu'elle redescende."
          - Le ballon du roi fait le tour de la cape, en roulant le long du bord, sans tomber. Pour cela, chacun lève et baisse la cape au bon moment.
          - "Pour finir, la tente du carnaval : on lève la cape, on fait trois pas en avant ensemble, on la ramène derrière son dos et on s'assoit sur le bord. Tout le monde se retrouve à l'intérieur."
      - lieu: À l'intérieur
        espace: Une salle de motricité ou un salon débarrassé, sans lustre ni objet fragile à hauteur des bras
        mise_en_place: >-
          Même installation. Si le plafond est bas ou la pièce étroite, prenez une nappe plus petite et jouez à six ou huit.
          À l'intérieur, les boules de papier de soie valent mieux que les balles, qui rebondissent partout.
        deroulement:
          - Même jeu que dehors, à genoux pour les vagues et les confettis.
          - "La surprise du roi : tout le monde ferme les yeux, et le roi glisse un enfant sous la cape. On ouvre les yeux et on regarde qui manque autour. Celui qui trouve le premier passe dessous au tour suivant."
          - "Le retour au calme : les enfants s'allongent sur le dos, et deux adultes font onduler la cape bien au-dessus d'eux, comme un vent tiède. On compte les vagues à voix basse."
    regles:
      - On tient la cape à deux mains, sauf pour passer dessous.
      - On ne lâche jamais la cape d'un coup. On la pose d'abord au sol.
      - Sous la cape, on marche, on ne court pas et on ne s'allonge pas.
      - "Personne n'est éliminé. Un confetti tombé n'est pas une faute : c'est un confetti à remettre."
    adapter:
      - "3-4 ans : les vagues, les confettis et le changement de place, avec un seul enfant à la fois, appelé par son prénom. Pas plus de 10 minutes : arrêtez avant que les bras se fatiguent."
      - "5-6 ans : le jeu tel quel, avec le ballon."
      - "7 ans : deux ballons de deux couleurs, qui font le tour dans les deux sens sans se toucher. Ou un défi chronométré : combien de confettis restent sur la cape après une minute de tempête ?"
    securite:
      - "Personne ne s'enroule dans la cape, et elle ne se pose jamais sur la tête ou le visage d'un enfant. Sous la tente, les bords restent soulevés."
      - "Rien à moins d'un mètre derrière les enfants (chaise, table, radiateur) : quand la cape monte, ils reculent sans regarder."
      - Si le ballon de baudruche éclate, ramassez tous les morceaux, que les petits pourraient mettre à la bouche.
    fin: >-
      Assis sous la tente, le roi Carnaval raconte à voix basse où passera le défilé cette année. Puis on soulève la cape une
      dernière fois, tout le monde sort en saluant, et on la plie à plusieurs, deux enfants par coin : c'est encore un jeu,
      et le rangement est fait.

  # ------------------------------------------------------------ Pâques
  - id: chasse-aux-oeufs-des-couleurs
    fete: paques
    nom: La chasse aux œufs des couleurs
    accroche: Une chasse aux œufs juste, où les plus grands ne ramassent pas tout. Avec des énigmes pour les 8 ans et plus.
    age_min: 2
    age_max: 12
    ages: [3-5-ans, 6-8-ans, 9-12-ans]
    joueurs: [2, 30]
    duree: 30
    but: Retrouver tous les œufs de sa couleur, puis l'œuf d'or, cherché tous ensemble.
    materiel:
      - "Des œufs en chocolat dans des papiers de couleur, ou des œufs en plastique à remplir : une couleur par enfant ou par tranche d'âge"
      - "Le même nombre d'œufs pour chaque couleur (5 à 10)"
      - Un panier ou un sac par enfant
      - "Un œuf d'or : un gros œuf ou une boîte dorée, à partager à la fin"
      - "Pour les 8 ans et plus : une carte énigme par œuf"
    histoire: >-
      Les cloches sont passées, mais elles ont été prudentes : chaque enfant a sa couleur d'œufs.
      Et quelque part, elles ont caché un œuf d'or qu'il faudra trouver tous ensemble.
    versions:
      - lieu: Dehors
        espace: Un jardin ou un coin de parc
        mise_en_place: >-
          Partagez le jardin en zones : les petits près de la maison, les grands au fond.
          Chez les petits, les œufs sont posés en vue, dans l'herbe ou au pied d'un pot. Chez les grands, ils sont
          bien cachés, à 1,20 m de haut au plus. L'œuf d'or est caché à part, pour la fin.
        deroulement:
          - Chaque enfant reçoit son panier et sa couleur, puis part chercher ses œufs dans sa zone.
          - Celui qui trouve un œuf d'une autre couleur le laisse en place. Il peut aider son propriétaire en disant « tu chauffes » ou « tu refroidis ».
          - Quand chacun a tous ses œufs, l'adulte lance la recherche de l'œuf d'or, que l'on cherche tous ensemble.
      - lieu: À l'intérieur
        espace: Deux ou trois pièces de la maison ou de la salle
        mise_en_place: >-
          Évitez le chocolat près des radiateurs et du soleil. Le plus simple, c'est de cacher des œufs en papier
          de couleur, à échanger contre des œufs en chocolat à la fin.
        deroulement:
          - Même jeu que dehors, en marchant, avec une pièce par tranche d'âge si possible.
          - "Pour les 8 ans et plus, chaque énigme donne la cachette d'un œuf : « Je suis plein de pages mais je ne parle pas » (la bibliothèque)."
    regles:
      - Chacun ne ramasse que sa couleur.
      - Un œuf d'une autre couleur reste où il est.
      - L'œuf d'or se cherche ensemble et se partage entre tous.
    adapter:
      - "2-4 ans : 4 ou 5 œufs bien visibles, et un adulte à côté. Pas d'œuf d'or ou un œuf d'or posé en vue."
      - "5-7 ans : 6 à 8 œufs, à moitié cachés."
      - "8-12 ans : des énigmes, et un œuf d'or qui ne se trouve qu'avec une dernière énigme, formée par une lettre écrite sur chaque œuf."
    securite:
      - Pas d'œuf caché près d'un bassin, d'une piscine, d'une route ou dans un endroit où l'on doit grimper.
      - Pour les moins de 3 ans, pas de petits objets que l'on peut avaler.
    fin: >-
      L'œuf d'or est ouvert devant tout le monde et partagé. Chacun garde les œufs de sa couleur.

  - id: voleurs-de-nids
    fete: paques
    nom: Les voleurs de nids
    accroche: Quatre équipes, quatre nids et des œufs qu'on se vole à tour de rôle. Rapide et très rythmé.
    age_min: 6
    age_max: 12
    ages: [6-8-ans, 9-12-ans]
    joueurs: [8, 32]
    duree: 15
    but: Être la première équipe à avoir 6 œufs dans son nid.
    materiel:
      - "Une vingtaine d'œufs : œufs en plastique, balles de tennis ou chaussettes roulées en boule"
      - Un panier pour le centre
      - 4 cerceaux ou 4 cartons, qui servent de nids
      - Des chasubles ou foulards de 4 couleurs
    histoire: >-
      Au printemps, toutes les poules du poulailler veulent le plus beau nid. Et pour le remplir,
      tous les moyens sont bons… même aller chercher les œufs chez les voisines.
    versions:
      - lieu: Dehors
        espace: Une cour ou un jardin, un carré de 15 à 20 m de côté
        mise_en_place: >-
          Le panier d'œufs est au centre. Chaque nid est dans un coin, à 8 ou 10 m du panier.
          Chaque équipe se place en file derrière son nid.
        deroulement:
          - Au signal, le premier joueur de chaque équipe court prendre un œuf, au centre ou dans le nid d'une autre équipe.
          - Il le rapporte et le pose dans son nid, puis tape dans la main du suivant.
          - Dès qu'une équipe a 6 œufs dans son nid, elle crie « Cot cot ! ». L'arbitre vérifie et arrête la manche.
          - On remet les œufs au centre et on joue une nouvelle manche.
      - lieu: À l'intérieur
        espace: Une salle dégagée, 3 à 4 m entre le centre et les nids
        mise_en_place: >-
          Même installation, plus serrée. Utilisez des chaussettes roulées, qui ne roulent pas et ne cassent rien.
        deroulement:
          - "On se déplace en « pas de poussin » : talon contre pointe, sans courir."
          - Au lieu de courir, on peut aussi se déplacer à quatre pattes, l'œuf dans une main.
    regles:
      - Un seul œuf à la fois.
      - L'œuf est posé dans le nid, jamais lancé.
      - On ne protège pas son nid avec les mains ni avec le corps.
      - Le joueur suivant ne part qu'après avoir été touché dans la main.
    adapter:
      - "6-7 ans : on ne prend les œufs qu'au centre pendant la première manche, pour comprendre le jeu."
      - "8-9 ans : le jeu tel quel."
      - "10-12 ans : chaque équipe a un œuf doré qui vaut 2 points. Il faut 8 points pour gagner."
    securite:
      - Les joueurs se croisent au centre. Demandez de regarder devant soi et de ralentir près du panier.
    fin: >-
      Jouez en 3 manches gagnantes. L'équipe gagnante choisit le nom de la poule de l'année.

  - id: piste-du-lapin
    fete: paques
    ajoute: 2027-02-20
    nom: La piste du lapin
    accroche: Un vrai jeu de piste, avec des signes à lire, des fausses routes et des messages cachés, pour remonter jusqu'au terrier où le lapin a rangé ses œufs.
    age_min: 6
    age_max: 12
    ages: [6-8-ans, 9-12-ans]
    joueurs: [4, 24]
    duree: 45
    but: Suivre les signes laissés par le lapin, trouver les messages cachés le long de la piste et reconstituer le plan du terrier où sont rangés les œufs.
    materiel:
      - "Pour tracer la piste dehors : une craie, des bâtons et des cailloux. À l'intérieur : des flèches et des croix en papier, de la pâte adhésive et des gommettes."
      - Une fiche des signes par équipe, recopiée à la main sur une carte
      - "4 à 6 enveloppes, qui contiennent chacune un morceau du plan du terrier et une petite épreuve"
      - "Le trésor du terrier : un panier d'œufs à partager, en chocolat ou en plastique"
      - Un crayon par équipe
    histoire: >-
      Le lapin a fini sa distribution avant tout le monde. Fatigué, il a rangé ses derniers œufs dans son terrier secret
      et il est parti faire la sieste. Mais il a laissé des traces derrière lui : des flèches, des croix, des petits tas de
      cailloux. Ceux qui savent lire la piste du lapin trouveront le terrier.
    versions:
      - lieu: Dehors
        espace: Un grand jardin, un parc ou un bois que vous connaissez bien, sur un parcours de 200 à 500 m aux limites claires
        mise_en_place: >-
          Un adulte trace la piste juste avant le jeu, sans être vu. Tous les 10 à 20 m, un signe : une flèche à la craie,
          ou faite de deux bâtons. Ajoutez deux ou trois fausses routes, fermées un peu plus loin par une croix. Là où un message
          attend, posez un petit tas de trois cailloux et cachez l'enveloppe à trois pas, dans la direction de la dernière flèche.
          Le terrier est marqué d'un rond avec un point au milieu. Avec plusieurs équipes, prévoyez une couleur de craie
          par équipe ou des départs décalés de 5 minutes.
        deroulement:
          - "Avant le départ, chaque équipe apprend les signes avec sa fiche : la flèche (on suit), la croix (pas par là, on revient au dernier signe), le tas de cailloux (un message est caché à trois pas), le rond avec un point (le terrier est ici)."
          - "L'équipe suit la piste en marchant groupée. Celui qui repère le signe suivant ne crie pas : il lève la main, et l'équipe s'arrête pour le lire ensemble."
          - "À chaque message, l'équipe réussit la petite épreuve écrite dans l'enveloppe avant de prendre le morceau de plan : dix sauts de lapin, une devinette, trois fleurs de couleurs différentes à montrer sans les cueillir."
          - "Après une croix, on revient au dernier signe et on cherche une autre direction. Les fausses routes font partie du jeu : c'est là que l'équipe apprend à s'écouter."
          - Avec tous les morceaux, l'équipe assemble le plan du terrier et part chercher les œufs. Le rond avec un point lui confirme qu'elle est au bon endroit.
      - lieu: À l'intérieur
        espace: Une maison entière ou un bâtiment d'accueil, couloirs compris, avec l'accord des personnes qui occupent les pièces traversées
        mise_en_place: >-
          Les flèches et les croix en papier se collent à la pâte adhésive sur les portes, les pieds de table et les plinthes.
          Le tas de cailloux devient trois gommettes en triangle. Les enveloppes se cachent dans une chaussure, sous une chaise,
          au fond d'une boîte à jouets.
        deroulement:
          - Même jeu que dehors, en marchant, et à voix basse dans les couloirs.
          - "Pour les grands, ajoutez le signe du nombre : une flèche qui porte un chiffre veut dire « faites ce nombre de pas dans cette direction ». Le message est caché à l'endroit exact où l'on s'arrête."
          - "Si deux équipes jouent, chacune a sa couleur de flèches, et les deux pistes se croisent au moins une fois : il faut bien regarder la couleur avant de suivre."
    regles:
      - L'équipe reste groupée et ne court pas. C'est le plus lent qui donne le rythme.
      - On n'arrache pas les signes et on ne les déplace pas, même ceux des autres équipes.
      - Un message trouvé est remis en place pour l'équipe suivante, sauf si chaque équipe a ses propres enveloppes.
      - Une équipe perdue depuis plus de cinq minutes peut demander un indice à l'adulte, une seule fois.
    adapter:
      - "6-7 ans : une piste courte (100 à 200 m), sans fausse route, avec des flèches bien visibles et 3 messages. Un adulte marche avec l'équipe sans jamais montrer le chemin."
      - "8-9 ans : le jeu tel quel, avec deux fausses routes."
      - "10-12 ans : des messages codés (chaque lettre remplacée par la suivante dans l'alphabet, ou des mots écrits à l'envers) et le signe du nombre de pas. Dans un jardin fermé, la piste peut se séparer en deux branches : l'équipe se partage et doit se retrouver au terrier."
    securite:
      - Repérez le parcours la veille. Pas de piste le long d'une route, d'un bassin ou d'un fossé, et des limites que l'on annonce au départ.
      - Dans un parc ouvert, un adulte accompagne chaque équipe. Dans un jardin fermé, un adulte au départ et un au terrier suffisent.
      - "Allergies : vérifiez la composition des œufs en chocolat (lait, fruits à coque) avant le partage."
    fin: >-
      Au terrier, on n'ouvre pas le panier tout de suite : on attend que toutes les équipes soient arrivées. Chacune raconte
      la fausse route où elle s'est fait avoir, et le détail qui l'a remise sur la bonne piste. Les œufs se partagent à parts
      égales. Pendant ce temps, un adulte repasse sur le parcours pour effacer la craie et ramasser les flèches oubliées.

  - id: petanque-des-oeufs
    fete: paques
    ajoute: 2027-03-20
    nom: La pétanque des œufs
    accroche: Un jeu calme d'adresse, où l'on fait rouler des œufs en plastique au plus près du poussin. Ils ne vont jamais tout droit, et c'est tout le plaisir.
    age_min: 4
    age_max: 10
    ages: [3-5-ans, 6-8-ans, 9-12-ans]
    joueurs: [2, 12]
    duree: 20
    but: Faire rouler ses œufs le plus près possible du poussin, en jouant avec leur forme, puisqu'un œuf ne roule jamais en ligne droite.
    materiel:
      - "6 à 12 œufs en plastique de deux ou trois couleurs, une couleur par équipe. Remplissez-les à moitié de riz ou de lentilles et fermez-les d'un tour d'adhésif : ils roulent moins vite et ne s'ouvrent pas."
      - "Le poussin : une balle de ping-pong jaune, un pompon ou un gros bouchon"
      - Une ficelle ou une craie pour la ligne de lancer
      - Un bout de ficelle pour mesurer les égalités
    histoire: >-
      Au printemps, le premier poussin de la ferme est sorti de sa coquille et il a filé dans l'herbe. Les poules organisent
      un concours : quelle famille d'œufs saura rouler jusqu'à lui ? Le problème, c'est qu'un œuf ne va jamais où l'on veut.
    versions:
      - lieu: Dehors
        espace: Une allée de terre, un chemin de sable ou une pelouse tondue court, sur 4 à 6 m de long
        mise_en_place: >-
          Tracez la ligne de lancer. Un joueur lance le poussin à 3 ou 4 m devant lui, ou l'adulte le pose pour les petits.
          Les équipes se partagent les œufs, deux ou trois par joueur selon le nombre. Dans l'herbe haute, les œufs s'arrêtent
          aussitôt : choisissez le sol le plus plat et le plus ras.
        deroulement:
          - Le premier joueur, accroupi derrière la ligne, fait rouler un œuf vers le poussin, par en dessous, sans le lancer en l'air.
          - "Un joueur de l'autre équipe fait rouler le sien. Ensuite, c'est toujours l'équipe la plus loin du poussin qui rejoue, jusqu'à ce qu'elle reprenne la meilleure place ou qu'elle n'ait plus d'œufs."
          - "Un œuf peut pousser un autre œuf, ou même le poussin : on joue là où tout s'est arrêté."
          - "Quand tous les œufs ont roulé, on compte : l'équipe la plus proche marque un point pour chacun de ses œufs plus près du poussin que le meilleur œuf adverse."
          - Le gagnant de la manche lance le poussin pour la suivante. La partie se joue en 7 points.
      - lieu: À l'intérieur
        espace: Un couloir, un grand tapis ou un parquet, 3 m suffisent
        mise_en_place: >-
          Sur un sol lisse, les œufs filent loin : jouez à genoux et réduisez la distance à 2 m. Posez des coussins ou des livres
          sur les côtés pour faire des bords, comme une piste de billes.
        deroulement:
          - Même jeu que dehors, à genoux.
          - "Le nid : remplacez le poussin par une assiette en carton ou un couvercle de boîte à chaussures. Un œuf qui s'arrête dans le nid vaut 3 points, un œuf qui touche le bord vaut 1 point."
          - "Le jardin à obstacles : placez deux ou trois rouleaux de papier toilette debout entre la ligne et le poussin. Il faut les contourner en profitant de la courbe de l'œuf."
    regles:
      - On fait rouler l'œuf, on ne le lance pas.
      - Les pieds, ou les genoux, restent derrière la ligne jusqu'à ce que l'œuf s'arrête.
      - On ne touche aucun œuf avant la fin de la manche.
      - En cas d'égalité, on mesure avec la ficelle. Si c'est vraiment pareil, personne ne marque.
    adapter:
      - "4-5 ans : un nid à la place du poussin, posé à 1,50 m. Chacun fait rouler ses trois œufs à la suite, et l'on compte ensemble ceux qui sont dans le nid. Pas d'équipes ni de points."
      - "6-8 ans : le jeu tel quel, à deux équipes."
      - "9-10 ans : chaque œuf est rempli autrement (vide, plein de riz, une boulette de pâte à modeler collée d'un seul côté), et chacun choisit son œuf selon le terrain. Laissez-les découvrir seuls que l'œuf lesté d'un côté tourne toujours dans le même sens, et qu'il faut viser à côté du poussin."
    securite:
      - Fermez bien les œufs remplis. Riz, lentilles et pâte à modeler restent hors de portée des tout-petits qui passent par là.
      - On attend que tout le monde soit derrière la ligne avant de faire rouler.
    fin: >-
      Pour finir, une manche tous ensemble, sans équipes : chacun fait rouler un seul œuf, et l'on regarde où s'est arrêtée la
      couvée autour du poussin. Le plus proche choisit qui range. Les œufs remplis et le poussin vont dans une boîte à chaussures :
      le jeu est prêt pour le prochain après-midi de printemps.
