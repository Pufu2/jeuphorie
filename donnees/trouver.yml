    faq:
      - ["Quels jeux de ballon pour 10 ans ?", "La balle au capitaine, la passe à 5, le ballon prisonnier, le rugby au toucher."]
      - ["Comment éviter qu'un seul joueur garde le ballon ?", "Trois secondes au plus avec le ballon, et une passe obligatoire avant de tirer."]
      - ["Quels jeux de ballon sans contact ?", "Le rugby au toucher, l'ultimate, la balle au capitaine : on touche, on ne plaque pas."]
