    h1: Jeux de ballon pour les 9-12 ans
    intro: >-
      À 9-12 ans, les jeux de ballon deviennent des vrais jeux d'équipe : passes, démarquage, stratégie. Les sports
      adaptés (sans contact, avec des règles simplifiées) permettent à tous de jouer, pas seulement aux sportifs du groupe.
    conseils:
      - "Une règle de passes obligatoires avant de marquer fait jouer tout le monde."
