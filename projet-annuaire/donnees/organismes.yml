# Organismes de formation BAFA/BAFD utiles pour l'Île-de-France (étape B).
# Référence officielle : arrêté du 4 septembre 2026 (JO du 17 sept. 2026), habilitations
# du 1er janv. 2026 au 31 janv. 2029 — article 1 national, article 3 régional :
# https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000054850965
# Liste officielle : https://bafa-bafd.jeunes.gouv.fr/baf-candidat/app/liste-organisme-formation
# page_sessions « vérifiée » = URL vue dans un résultat de recherche le 24/10/2026 ;
# « à trouver » = je n'ai pas pu la confirmer (réseau bloqué). À compléter avec l'arrêté.
organismes:
  afocal:
    nom: AFOCAL
    habilitation: nationale
    page_sessions: https://www.afocal.fr/bafa/recherche-bafa-1-0.html
    etat: vérifiée (affiche lieu, dates, prix, « complet »)
  ufcv:
    nom: UFCV
    habilitation: nationale
    page_sessions: https://bafa.ufcv.fr/Bafa-Bafd-Ufcv-Ile-de-France
    etat: vérifiée
  ifac:
    nom: IFAC
    habilitation: nationale
    page_sessions: "https://ifac-formation.fr/formations/sessions/bafa/%C3%8Ele-de-France"
    etat: vérifiée
  ligue-idf:
    nom: Ligue de l'enseignement Île-de-France
    habilitation: nationale (réseau)
    page_sessions: https://www.laligueidf.org/bafa-bafd/
    etat: vérifiée (brochure annuelle)
  fscf:
    nom: FSCF
    habilitation: nationale
    page_sessions: https://www.fscf.asso.fr
    etat: domaine vérifié, page des sessions à trouver
  planete-sciences:
    nom: Planète Sciences
    habilitation: nationale
    page_sessions: https://www.planete-sciences.org/animations-formations/formations-53/BAFA
    etat: vérifiée
  cemea-idf:
    nom: CEMEA Île-de-France
    habilitation: nationale (réseau)
    page_sessions: null
    etat: à trouver
  francas:
    nom: Francas
    habilitation: nationale
    page_sessions: null
    etat: à trouver
  leo-lagrange:
    nom: Léo Lagrange
    habilitation: nationale
    page_sessions: null
    etat: à trouver
  familles-rurales:
    nom: Familles Rurales
    habilitation: nationale
    page_sessions: null
    etat: à trouver
  ucpa:
    nom: UCPA
    habilitation: nationale
    page_sessions: null
    etat: à trouver
  scoutisme:
    nom: Scouts et Guides de France, EEDF, EEUdF (formations souvent réservées aux membres)
    habilitation: nationale
    page_sessions: null
    etat: à trouver
  cpcv-idf:
    nom: CPCV Île-de-France
    habilitation: à confirmer dans l'arrêté
    page_sessions: null
    etat: à trouver
  # + les organismes de l'article 3 (habilitation régionale Île-de-France) : à relever dans l'arrêté.

# Concurrents ou sources déjà en ligne (à surveiller, pas à copier) :
existants:
  - nom: Portail officiel du ministère
    url: https://bafa-bafd.jeunes.gouv.fr/baf-candidat/app/liste-session
