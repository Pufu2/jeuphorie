    note: liste des prochaines formations BAFA/BAFD par région et par date
  - nom: Animyjob (annuaire des organismes par région)
    url: https://www.animyjob.com/organisme-formation-bafa/region/occitanie
  - nom: Branche Éclat (carte des organismes habilités)
    url: https://branche-eclat.org/carte-interactive-of-habilites/
