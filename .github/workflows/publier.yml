name: Publier le site

on:
  # à chaque modification envoyée sur la branche principale
  push:
    branches: [main]
  # chaque matin à 6 h 15 (heure de Paris en hiver) : publie les articles
  # dont la date est arrivée
  schedule:
    - cron: "15 5 * * *"
  # bouton « Run workflow » dans l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils de fabrication
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Polices hébergées sur le site
        run: |
          npm install --no-save --no-package-lock @fontsource/bricolage-grotesque@5 @fontsource/atkinson-hyperlegible@5 @fontsource/gochi-hand@5
          python3 outils/polices.py
      - name: Fabriquer le site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: fabriquer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

  signaler:
    # prévient les moteurs de recherche des pages publiées (IndexNow)
    needs: publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Prévenir Bing, Qwant, DuckDuckGo et les autres
        run: |
          sleep 60
          if [ "${{ github.event_name }}" = "schedule" ]; then python3 outils/indexnow.py; else python3 outils/indexnow.py --tout; fi

  reseaux:
    # publie le sujet du jour sur Facebook et Instagram (mardi, jeudi, samedi), une seule fois par jour
    needs: publier
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publier sur Facebook et Instagram
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
        run: |
          sleep 60
          python3 outils/publier_reseaux.py
