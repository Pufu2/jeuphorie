name: Lettre mensuelle

on:
  # le premier mardi du mois, vers 9 h 30 (heure de Paris) : le cron tourne les mardis 1 à 7
  schedule:
    - cron: "17 7 1-7 * 2"
  workflow_dispatch:

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Composer et envoyer la lettre
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python3 outils/lettre.py
