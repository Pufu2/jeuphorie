# Réglages du site Jeuphorie
# Modifier ici, puis le site se refabrique tout seul à la publication.

nom: Jeuphorie
signature: Jeux et animations clés en main
description: >-
  Kits de jeux et d'animations à imprimer pour les anniversaires, les fêtes
  et les grands jeux, conçus par un directeur d'animation.

# Adresse du site. Tant que le nom de domaine n'est pas acheté,
# c'est l'adresse GitHub Pages (à mettre à jour après la création du compte).
url: https://jeuphorie.fr
# À remplir le jour où le nom de domaine est relié au site (ex. jeuphorie.fr).
# Laisser vide tant que le site est à l'adresse github.io.
nom_de_domaine: jeuphorie.fr

# Si le site est publié dans un sous-dossier (ex. https://compte.github.io/jeuphorie/),
# indiquer ici ce sous-dossier : "/jeuphorie". Laisser vide avec un nom de domaine.
chemin_de_base: ""

langue: fr

# Adresse de contact affichée sur le site.
email: contact@jeuphorie.fr

auteur:
  prenom: Rafaël

# Boutique Payhip
